    linhasCli[c].forEach(r=>{ if(f!==null && famDe(r[1])!==f) return;
      const o = it[r[1]] = it[r[1]] || {p:r[1], va:0, vb:0, qa:0, qb:0, ult:-1};
      if(r[2]>=A && r[2]<=B){ o.va+=r[3]; o.qa+=r[4]; }
      else if(r[2]>=per.a && r[2]<=per.b){ o.vb+=r[3]; o.qb+=r[4]; }
      if((r[3]>0||r[4]>0) && r[2]>o.ult) o.ult = r[2]; });
    return Object.values(it).filter(o=>Math.abs(o.va)>=1||Math.abs(o.vb)>=1)
      .map(o=>({...o, dif:o.vb-o.va, dq:o.qb-o.qa,
        sit: o.va>0&&o.vb<=0 ? ["Parou de levar","s-bad"] : o.va<=0&&o.vb>0 ? ["Item novo","s-good"] : o.vb<o.va ? ["Levou menos","s-warn"] : ["Levou mais","s-good"]}))
      .sort((x,y)=>x.dif-y.dif);
  }
  function opItensHTML(x, pAntes, pAgora, cols){
    const l = opItens(x.c, x.f, opPer), mostra = x.f===null ? l.filter(o=>o.dif<0).slice(0,15) : l;
    const cel = (v,q) => `${brl0(v)}<span class="un">${un(q)}</span>`;
    return `<tr class="itens"><td colspan="${cols}"><div class="itbox">
      <table><thead><tr><th class="l">Item${x.f===null?" (15 maiores quedas)":""}</th><th>${pAntes}</th><th>${pAgora}</th><th>Diferença</th><th class="l">Situação</th><th class="l">Última compra</th></tr></thead><tbody>
      ${mostra.map(o=>`<tr><td class="l nome">${esc(P.produtos[o.p][0])}</td><td>${cel(o.va,o.qa)}</td><td>${cel(o.vb,o.qb)}</td>
        <td class="${o.dif<0?"neg":"pos"}">${o.dif<0?"−":"+"}${brl0(Math.abs(o.dif))}<span class="un">${o.dq>0?"+":o.dq<0?"−":""}${un(Math.abs(o.dq))}</span></td>
        <td class="l"><span class="pill ${o.sit[1]}">${o.sit[0]}</span></td><td class="l">${o.ult>=0?mesCurto(P.meses[o.ult]):"–"}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">sem itens</td></tr>`}
      </tbody></table>
      <div class="rod"><span>Unidades = quantidade faturada. Itens que cresceram também aparecem: às vezes o cliente só trocou de apresentação.</span><button class="linkbtn" data-cli="${x.c}">Abrir ficha completa →</button></div>
    </div></td></tr>`;
  }

  const nomeOp = x => x.fil===undefined ? nomeCli(x.c)
    : `${esc(GRUPOS[x.g].nome)} <span class="pill fil">${x.nFil} filiais</span><div class="cod">Cliente principal · toque para ver cada filial</div>`;
  const nomeCurto = x => x.fil===undefined ? P.clientes[x.c][1] : GRUPOS[x.g].nome;
  function opFiliaisHTML(x, pAntes, pAgora, cols){
    return `<tr class="itens"><td colspan="${cols}"><div class="itbox">
      <table><thead><tr><th class="l">Filial</th><th>${pAntes}</th><th>${pAgora}</th><th>Diferença</th><th class="l">Situação</th></tr></thead><tbody>
      ${x.fil.map(o=>{ const d=o.agora-o.antes, ab=opFil===o.c;
        const sit = o.antes>0&&o.agora<=0 ? ["Parou de comprar","s-bad"] : o.antes<=0&&o.agora>0 ? ["Começou a comprar","s-good"] : d<0 ? ["Comprou menos","s-warn"] : ["Comprou mais","s-good"];
        return `<tr class="click${ab?" exp":""}" tabindex="0" data-fil="${o.c}" aria-expanded="${ab}"><td class="l nome"><span class="seta">▸</span>${nomeCli(o.c)}</td><td>${brl0(o.antes)}</td><td>${brl0(o.agora)}</td>
          <td class="${d<0?"neg":"pos"}">${d<0?"−":"+"}${brl0(Math.abs(d))}</td><td class="l"><span class="pill ${sit[1]}">${sit[0]}</span></td></tr>`
          + (ab ? opItensHTML(o, pAntes, pAgora, 5) : ""); }).join("") || `<tr><td colspan="5" class="empty">sem compras nas filiais</td></tr>`}
      </tbody></table>
      <div class="rod"><span>Toque numa filial para ver item por item.</span></div>
    </div></td></tr>`;
  }
  function opCalc(per){
    const A=per.a-12, B=per.b-12;
    // por cliente: total antes/agora e por família antes/agora
    const cli = Array.from({length:NC}, ()=>({ta:0,tb:0,fa:{},fb:{},pa:{},qa:{},qb:{}}));
    P.vendas.forEach(r=>{
      const m=r[2], o=cli[r[0]], f=famDe(r[1]);
      if(m>=A && m<=B){ o.ta+=r[3]; o.fa[f]=(o.fa[f]||0)+r[3]; o.qa[f]=(o.qa[f]||0)+r[4]; (o.pa[f]=o.pa[f]||{})[r[1]]=((o.pa[f]||{})[r[1]]||0)+r[3]; }
      else if(m>=per.a && m<=per.b){ o.tb+=r[3]; o.fb[f]=(o.fb[f]||0)+r[3]; o.qb[f]=(o.qb[f]||0)+r[4]; }
    });
    const fams = {};
    [...OP_FAMILIAS,...OP_SO_RESUMO].forEach(f=>fams[f]={antes:0,agora:0});
    cli.forEach(o=>{ Object.entries(o.fa).forEach(([f,v])=>{ (fams[f]=fams[f]||{antes:0,agora:0}).antes+=v; });
                     Object.entries(o.fb).forEach(([f,v])=>{ (fams[f]=fams[f]||{antes:0,agora:0}).agora+=v; }); });
    const tipo = o => o.tb<=0 ? "parou" : (o.tb < o.ta*0.9 ? "geral" : "familia");
    const umCli = f => cli.map((o,c)=>{
      const antes = f===null ? o.ta : (o.fa[f]||0), agora = f===null ? o.tb : (o.fb[f]||0);
      const qAntes = f===null ? null : (o.qa[f]||0), qAgora = f===null ? null : (o.qb[f]||0);
      return {c, f, antes, agora, gap:antes-agora, qAntes, qAgora, tipo: f===null ? (o.tb<=0?"parou":"geral") : tipo(o), varTot: o.ta>0 ? o.tb/o.ta-1 : null,
              prods: f===null ? [] : Object.entries(o.pa[f]||{}).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([p])=>P.produtos[p][0]), k:"c"+c};
    });
    // Agrupado: filiais somadas no cliente principal; cada filial fica guardada para abrir depois
    const gaps = f => { const l = umCli(f);
      if(!opGrupo || !GRUPOS.length) return l.filter(x=>x.gap>=OP_MIN).sort((x,y)=>y.gap-x.gap);
      const out = l.filter(x=>grupoDe[x.c]<0);
      GRUPOS.forEach((g,gi)=>{
        const fil = g.cs.map(c=>l[c]).filter(x=>Math.abs(x.antes)>=1||Math.abs(x.agora)>=1).sort((x,y)=>y.gap-x.gap);
        const soma = k => g.cs.reduce((s,c)=>s+(l[c][k]||0),0);
        const o = {ta:g.cs.reduce((s,c)=>s+cli[c].ta,0), tb:g.cs.reduce((s,c)=>s+cli[c].tb,0)};
        const pa = {}; g.cs.forEach(c=>Object.entries(cli[c].pa[f]||{}).forEach(([p,v])=>pa[p]=(pa[p]||0)+v));
        const antes = soma("antes"), agora = soma("agora");
        out.push({c:g.cs[0], g:gi, f, antes, agora, gap:antes-agora, qAntes: f===null?null:soma("qAntes"), qAgora: f===null?null:soma("qAgora"),
          tipo: f===null ? (o.tb<=0?"parou":"geral") : (o.tb<=0 ? "parou" : (o.tb < o.ta*0.9 ? "geral" : "familia")),
          varTot: o.ta>0 ? o.tb/o.ta-1 : null, prods: Object.entries(pa).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([p])=>P.produtos[p][0]),
          fil, nFil:g.cs.length, k:"g"+gi});
      });
      return out.filter(x=>x.gap>=OP_MIN).sort((x,y)=>y.gap-x.gap); };
    const tot = {antes:cli.reduce((s,o)=>s+o.ta,0), agora:cli.reduce((s,o)=>s+o.tb,0)};
    return {fams, gaps, tot};
  }
  const TIPOS = {
    familia:{rot:"Só nesta família", cls:"s-good", dica:"Cliente ativo, comprou menos só desta linha. Oportunidade mais fácil."},
    geral:  {rot:"Caiu no geral",    cls:"s-warn", dica:"Cliente comprou menos de tudo. Precisa de visita e conversa."},
    parou:  {rot:"Parou de comprar", cls:"s-bad",  dica:"Não comprou nada no período. Recuperar o cliente."}
  };

  function drawOport(){
    if(!OP_PERIODOS.length){ section(`<div class="head"><div><h1>Oportunidades</h1></div></div><div class="panel empty">sem dado para comparar</div>`); return; }
    section(`
      <div class="head"><div><h1>Oportunidades</h1><div class="sub" id="opsub"></div></div>
        <select id="opper" aria-label="Período">${OP_PERIODOS.map(p=>`<option value="${p.id}">${p.id==="ano"?"Ano até o último mês fechado":p.rot}</option>`).join("")}</select></div>
      <section class="row2 op">
        <div class="panel"><div class="ph"><div><h2>Minhas famílias</h2><div class="sub">Clique numa família para ver os clientes</div></div><span class="tag" id="optag"></span></div><div class="fams" id="opfams"></div></div>
        <div class="panel"><div class="ph"><div><h2>Pauta da semana</h2><div class="sub">As 10 maiores quedas, somando as famílias</div></div></div><div class="calls" id="oppauta"></div></div>
      </section>
      <div class="panel" id="oplista"></div>
      <div class="legend">${Object.values(TIPOS).map(t=>`<span><span class="pill ${t.cls}">${t.rot}</span> ${t.dica}</span>`).join("")}</div>`);
    el("opper").value = opPer.id;
    el("opper").addEventListener("change", e=>{ opPer = OP_PERIODOS.find(p=>p.id===e.target.value); desenha(); });
    el("opfams").addEventListener("click", opClick);
    if(C.beta) el("oppauta").addEventListener("click", e=>{ const b=e.target.closest("[data-pauta]"); if(!b) return;
      opFam = b.dataset.pf; opTipo = "todos"; opAberto = b.dataset.pauta; opFil = null; desenha();
      const tr = el("oplista").querySelector(`tr[data-exp="${opAberto}"]`); (tr||el("oplista")).scrollIntoView({behavior:"smooth", block:"start"}); });
    desenha();

    function desenha(){
      const R = opCalc(opPer), per = x => `${mesCurto(P.meses[x.a])} a ${mesCurto(P.meses[x.b])}`;
      const ant = {a:opPer.a-12, b:opPer.b-12};
      el("opsub").textContent = `${per(opPer)} comparado com ${per(ant)} · só meses fechados · quedas a partir de ${brl0(OP_MIN)}`;
      el("optag").textContent = `${pct(R.tot.antes>0?R.tot.agora/R.tot.antes-1:null)} no total`;
      // Barras por família: quem caiu primeiro
      const linhas = Object.entries(R.fams).filter(([,v])=>v.antes>0||v.agora>0)
        .map(([f,v])=>({f, ...v, dif:v.agora-v.antes, resumo:OP_SO_RESUMO.includes(f)}))
        .sort((x,y)=>(x.resumo-y.resumo) || (x.dif-y.dif));
      const geral = {f:null, antes:R.tot.antes, agora:R.tot.agora, dif:R.tot.agora-R.tot.antes};
      // escala inclui a linha Geral: sem isso a barra do total passa da borda quando o crescimento é alto
      const mxd = Math.max(...linhas.map(x=>Math.abs(x.dif)), Math.abs(geral.dif), 1);
      const linha = x => { const w=Math.abs(x.dif)/mxd*50, neg=x.dif<0, v = x.antes>0 ? x.agora/x.antes-1 : null;
        const nome = x.f===null ? "Geral (todas)" : (OP_ROTULO[x.f]||x.f);
        return `<button class="fam ${x.resumo?"so":""} ${opFam===x.f&&!x.resumo?"on":""}" ${x.resumo?"disabled":""} data-fam="${x.f===null?"__geral":x.f}" title="${x.resumo?"Linha nova: só resumo":"Ver clientes"}">
          <span class="fn">${nome}${x.resumo?' <span class="mini">linha nova</span>':""}</span>
          <span class="fb"><i class="${neg?"neg":"pos"}" style="${neg?`right:50%;width:${w}%`:`left:50%;width:${w}%`}"></i></span>
          <span class="fv ${neg?"neg":"pos"}">${neg?"−":"+"}${brl0(Math.abs(x.dif))}</span>
          <span class="fp">${v===null?"novo":(v>0?"+":"")+pct(v,0)}</span></button>`; };
      el("opfams").innerHTML = linha(geral) + linhas.map(linha).join("");
      // Pauta: maiores quedas somando todas as famílias
      const todas = OP_FAMILIAS.flatMap(f=>R.gaps(f)).sort((x,y)=>y.gap-x.gap).slice(0,10);
      el("oppauta").innerHTML = todas.length ? todas.map(x=>`<button class="call" ${C.beta?`data-pauta="${x.k}" data-pf="${x.f}"`:`data-cli="${x.c}"`}><span class="ini">${esc(iniciais(nomeCurto(x)))}</span><span style="min-width:0"><b>${esc(nomeCurto(x))}${x.fil?` <span class="pill fil">${x.nFil} filiais</span>`:""}</b><span>${OP_ROTULO[x.f]||x.f} · ${brl0(x.antes)} → ${brl0(x.agora)}</span></span><span style="text-align:right"><span class="v neg">−${brl0(x.gap)}</span><br><span class="pill ${TIPOS[x.tipo].cls}">${TIPOS[x.tipo].rot}</span></span></button>`).join("")
        : `<div class="empty">Nenhuma queda acima de ${brl0(OP_MIN)} no período.</div>`;
      desenhaLista(R, per(opPer), per(ant));
    }
    function desenhaLista(R, pAgora, pAntes){
      const box = el("oplista");
      if(opFam===undefined){ box.innerHTML = `<div class="empty">Escolha uma família acima para ver os clientes que mais caíram nela.</div>`; return; }
      const l = R.gaps(opFam);
      const cont = {todos:l.length}; l.forEach(x=>cont[x.tipo]=(cont[x.tipo]||0)+1);
      if(opTipo!=="todos" && !cont[opTipo]) opTipo="todos";
      const vis = l.filter(x=>opTipo==="todos"||x.tipo===opTipo), soma = vis.reduce((s,x)=>s+x.gap,0);
      const nome = opFam===null ? "todas as famílias" : (OP_ROTULO[opFam]||opFam);
      box.innerHTML = `<div class="ph"><div><h2>Clientes que caíram em ${nome}</h2><div class="sub">${vis.length} clientes · ${brl0(soma)} a menos que em ${pAntes}</div></div></div>
        <div class="tools">${GRUPOS.length?`<div class="seg" id="opgrp"><button data-g="1" class="${opGrupo?"on":""}">Por cliente principal</button><button data-g="0" class="${opGrupo?"":"on"}">Por filial</button></div>`:""}<div class="seg" id="optipo"><button data-t="todos" class="${opTipo==="todos"?"on":""}">Todos (${cont.todos})</button>${Object.entries(TIPOS).filter(([k])=>cont[k]).map(([k,t])=>`<button data-t="${k}" class="${opTipo===k?"on":""}">${t.rot} (${cont[k]})</button>`).join("")}</div></div>
        ${C.beta?`<div class="sub" style="margin:-4px 0 10px">Toque no cliente para ver item por item o que ele deixou de levar.</div>`:""}
        <div class="tbl"><table><thead><tr><th class="l">Cliente</th><th>${pAntes}</th><th>${pAgora}</th><th>Queda</th>${C.beta&&opFam!==null?"<th>Queda (un)</th>":""}<th class="l">Situação</th>${opFam===null?"":`<th>Cliente no total</th><th class="l">O que comprava</th>`}</tr></thead><tbody>
        ${vis.length ? vis.map(x=>{ const aberto = C.beta && opAberto===x.k, cols = 5+(C.beta&&opFam!==null?1:0)+(opFam===null?0:2);
          const dq = C.beta&&opFam!==null ? (x.qAntes||0)-(x.qAgora||0) : null;
          return `<tr class="click${aberto?" exp":""}" tabindex="0" ${C.beta?`data-exp="${x.k}" aria-expanded="${aberto}"`:`data-cli="${x.c}"`}><td class="l nome">${C.beta?'<span class="seta">▸</span>':""}${nomeOp(x)}</td><td>${brl0(x.antes)}</td><td>${brl0(x.agora)}</td><td class="neg">−${brl0(x.gap)}</td>${dq===null?"":`<td class="${dq>0?"neg":"pos"}">${dq>0?"−":dq<0?"+":""}${un(Math.abs(dq))}</td>`}<td class="l"><span class="pill ${TIPOS[x.tipo].cls}">${TIPOS[x.tipo].rot}</span></td>${opFam===null?"":`<td class="${ok(x.varTot)&&x.varTot<0?"neg":"pos"}">${ok(x.varTot)?(x.varTot>0?"+":"")+pct(x.varTot,0):"–"}</td><td class="l nome mini">${x.prods.map(esc).join("<br>")}</td>`}</tr>`
            + (aberto ? (x.fil ? opFiliaisHTML(x, pAntes, pAgora, cols) : opItensHTML(x, pAntes, pAgora, cols)) : ""); }).join("")
          : `<tr><td colspan="8" class="empty">Nenhum cliente com queda acima de ${brl0(OP_MIN)}.</td></tr>`}
        </tbody></table></div>`;
      el("optipo").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; opTipo=b.dataset.t; opAberto=null; desenhaLista(R,pAgora,pAntes); };
      if(el("opgrp")) el("opgrp").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; opGrupo = b.dataset.g==="1"; opAberto=null; opFil=null; desenha(); };
      if(C.beta){
        const abre = t => { if(t.dataset.fil!==undefined){ const c=+t.dataset.fil; opFil = opFil===c ? null : c; desenhaLista(R,pAgora,pAntes); return; }
          const c=t.dataset.exp; opAberto = opAberto===c ? null : c; opFil=null; desenhaLista(R,pAgora,pAntes);
          const tr = box.querySelector(`tr[data-exp="${c}"]`); if(tr && opAberto===c) tr.scrollIntoView({block:"nearest", behavior:"smooth"}); };
        const alvo = e => e.target.closest("[data-fil]") || e.target.closest("[data-exp]");
        box.onclick = e=>{ if(e.target.closest("[data-cli]")) return; const t=alvo(e); if(t) abre(t); };
        box.onkeydown = e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const t=alvo(e); if(t){ e.preventDefault(); abre(t); } };
      }
    }
    function opClick(e){
      const b = e.target.closest("[data-fam]"); if(!b || b.disabled) return;
      opFam = b.dataset.fam==="__geral" ? null : b.dataset.fam; opTipo="todos"; opAberto=null; opFil=null; desenha();
      el("oplista").scrollIntoView({behavior:"smooth", block:"start"});
    }
  }
  const iniciais = s => s.split(/\s+/).filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join("");

  // ========== PLANO DO MÊS ==========
  // Ajuda a montar a meta na 1ª semana: meta por família x o que já é esperado, clientes que devem comprar
  // (compraram no mesmo mês do ano passado ou estão no ritmo de recompra) e um plano que o RCA marca.
  // O plano fica salvo só neste aparelho (localStorage) e pode ser copiado/baixado para o Excel.
  const PL_FAMS = [["Bravecto","brav"],["Nobivac","nobiv"],["Defenza","defenz"],["Farma","farma"],["Scalibor","scalib"],["IDEXX","idexx"],["Numelvi",null]];
  const PL_ROT = {Nobivac:"Nobivac (vacinas)"};
  const PL_JAN = Math.max(P.meses.indexOf(`${ano}-01`), 12);
  function plCalc(){
    // valor por cliente x família x mês
    const cf = {};
    P.vendas.forEach(r=>{ const f=famDe(r[1]); const k=r[0]+"|"+f; (cf[k]=cf[k]||new Float64Array(M))[r[2]]+=r[3]; });
    const cands = [], fam = {};
    PL_FAMS.forEach(([f])=>fam[f]={ly:0, m3:0, agora:0});
    Object.entries(cf).forEach(([k,v])=>{
      const [c,f] = [+k.split("|")[0], k.split("|")[1]];
      if(fam[f]){ fam[f].ly += v[cur-12]||0; fam[f].m3 += ((v[cur-1]||0)+(v[cur-2]||0)+(v[cur-3]||0))/3; fam[f].agora += v[cur]||0; }
      if(!fam[f]) return;
      if((v[cur]||0)>0) return;                          // já comprou esta família no mês
      let n=0, s=0, ult=-1;
      for(let m=Math.max(cur-12,0); m<cur; m++) if(v[m]>0){ n++; s+=v[m]; ult=m; }
      const ly = cur-12>=0 ? v[cur-12] : 0;
      // gap = acumulado do ano (jan até o último mês fechado) contra o mesmo período do ano passado
      let ytd=0, ytdAnt=0; for(let m=PL_JAN; m<cur; m++){ ytd+=v[m]||0; if(m-12>=0) ytdAnt+=v[m-12]||0; }
      const gap = Math.max(ytdAnt-ytd, 0);
      if(n===0 && !(ly>0) && !(gap>0)) return;
      const intervalo = n>=3 ? Math.max(Math.round(12/n),1) : null, desde = ult>=0 ? cur-ult : null;
      // comprou recentemente: dentro do ritmo dele (ou no mês passado, se não tem ritmo) -> menos provável, vai para o fim
      const recente = desde!==null && (intervalo!==null ? desde<intervalo : desde<=1);
      const noRitmo = intervalo!==null && !recente && desde<=2*intervalo;
      const sazonal = ly>0;
      const valor = n>0 ? s/n : (ly>0 ? ly : gap);
      const pq = [];
      if(gap>0) pq.push(`caiu ${brl0(gap)} no ano`);
      if(sazonal) pq.push(`comprou ${brl0(ly)} em ${mesCurto(P.meses[cur-12])}`);
      if(noRitmo) pq.push(intervalo===1 ? "compra todo mês" : `compra a cada ~${intervalo} meses`);
      if(recente) pq.push(`comprou em ${mesCurto(P.meses[ult])}: pedido recente`);
      // grupo: 0 = com gap, 1 = sem gap (crescendo/estável), 2 = comprou recentemente
      const grupo = recente ? 2 : gap>0 ? 0 : 1;
      cands.push({c, f, valor, gap, grupo, recente, ult, n, pq:pq.join(" · "), k:c+"|"+f});
    });
    // ordem: maior gap primeiro; empate e sem gap = compra mais antiga primeiro; pedido recente por último
    cands.sort((a,b)=>a.grupo-b.grupo || b.gap-a.gap || a.ult-b.ult);
    return {cands, fam};
  }
  // Plano = valor que o RCA espera vender a cada cliente/família (Map chave -> R$). Antes era só marcado/desmarcado:
  // marcações antigas viram o pedido normal do cliente.
  const PL_KEY = `plano-${C.vendedor}-${C.mesRef}`;
  const plLer = cands => { try{ const j = JSON.parse(localStorage.getItem(PL_KEY)||"[]");
      if(Array.isArray(j)){ const v = new Map(cands.map(x=>[x.k,x.valor])); return new Map(j.filter(k=>v.has(k)).map(k=>[k,v.get(k)])); }
      return new Map(Object.entries(j).filter(([,x])=>x>0)); }catch(e){ return new Map(); } };
  const plGravar = m => { try{ localStorage.setItem(PL_KEY, JSON.stringify(Object.fromEntries(m))); }catch(e){} };

  // Sugestão de composição: reparte a meta total pelo jeito que o RCA costuma vender (média 12 meses fechados),
  // puxando mais das famílias em queda no ano e menos das que já crescem. Ajuste = 1 − metade do crescimento,
  // travado entre 0,7 e 1,3 para nunca pedir um valor irreal numa família.
  // Metas por família da empresa não aparecem no plano (vinham somando mais que a meta MSD; o Lucas pediu para tirar).
  const CP = [["Bravecto","brav","#5B9CF6"],["Nobivac","nobiv","#5FE0BF"],["Defenza","defenz","#A78BFA"],["Farma","farma","#F59E6B"],["Scalibor","scalib","#FCD34D"],["IDEXX","idexx","#F472B6"],["Numelvi",null,"#22D3EE"],["Outros",null,"#6B7F7B"]];
  function cpCalc(metaTot){
    const catDe = p => { const f=famDe(p); return CP.some(c=>c[0]===f) ? f : "Outros"; };
    const d = {}; CP.forEach(([f])=>d[f]={m12:0, ytd:0, ytdAnt:0});
    P.vendas.forEach(r=>{ const o=d[catDe(r[1])], m=r[2];
      if(m>=cur-12 && m<cur) o.m12+=r[3]/12;
      if(m>=PL_JAN && m<cur) o.ytd+=r[3];
      if(m>=PL_JAN-12 && m<cur-12) o.ytdAnt+=r[3]; });
    const t12 = CP.reduce((s,[f])=>s+d[f].m12,0);
    CP.forEach(([f])=>{ const o=d[f]; o.share = t12>0 ? o.m12/t12 : 0;
      o.g = o.ytdAnt>0 && !OP_SO_RESUMO.includes(f) ? o.ytd/o.ytdAnt-1 : null;   // IDEXX e Numelvi: linhas novas, entram pela média sem ajuste
      o.aj = o.g===null ? 1 : Math.min(Math.max(1-o.g/2, 0.7), 1.3);
      o.w = o.share*o.aj; });
    const tw = CP.reduce((s,[f])=>s+d[f].w,0);
    CP.forEach(([f])=>{ const o=d[f]; o.sug = tw>0 ? o.w/tw : 0; o.valor = ok(metaTot) ? metaTot*o.sug : null; });
    return {d, t12};
  }

  function drawPlano(){
    const metasOk = C.metasMes ? C.metasMes===C.mesRef : true;
    const R = plCalc(), marc = plLer(R.cands);
    let filtro = "todas";
    const metaDe = k => k && metasOk && ok(C.metas[k]) && C.metas[k]>0 ? C.metas[k] : null;
    const mTotal = metaDe("total"), vendidoTot = mt("total").real;
    const K = cpCalc(mTotal);   // sugestão por família (média 12 meses ajustada) = base do "Falta encontrar"
    section(`
      <div class="head"><div><h1>Plano de ${MES_NOME[mes-1]}</h1><div class="sub">Monte sua meta na primeira semana: de onde vai sair cada real</div></div>
        <div class="tools" style="margin:0"><button class="linkbtn" id="plcopiar">${ICON.copiar} Copiar para o Excel</button><button class="linkbtn" id="plbaixar">Baixar planilha</button></div></div>
      ${metasOk?"":`<div class="aviso">As metas de ${MES_NOME[mes-1]} ainda não foram carregadas. O histórico e a lista de clientes já valem; as metas aparecem assim que forem lançadas.</div>`}
      <section class="pl-top">
        <div class="panel"><div class="ph"><div><h2>Seu plano</h2><div class="sub">Vendido até agora + o que você espera dos clientes marcados</div></div></div><div id="plresumo"></div></div>
        <div class="panel"><div class="ph"><div><h2>Sugestão de composição</h2><div class="sub">Como dividir a meta pelo jeito que você vende</div></div></div><div id="plcomp"></div></div>
      </section>
      <div class="panel"><div class="ph"><div><h2>Meta por família</h2><div class="sub">Onde a meta está apertada · <b>Mesmo mês ${ano-1}</b>: o que seus clientes compraram em ${mesCurto(P.meses[cur-12])} · <b>Média 3 meses</b>: ${mesCurto(P.meses[cur-3])} a ${mesCurto(P.meses[cur-1])} · <b>Sugestão</b>: a composição ao lado · <b>Falta encontrar</b>: sugestão − vendido − planejado · <b>Planejado</b>: os valores que você colocou na lista abaixo</div></div></div><div class="tbl"><table id="plfam"></table></div></div>
      <div class="panel"><div class="ph"><div><h2>Quem deve comprar em ${MES_NOME[mes-1]}</h2><div class="sub">Clientes que ainda não compraram a família este mês. Primeiro quem mais caiu no ano; depois quem está há mais tempo sem comprar; por último quem fez pedido recente. Coloque quanto espera vender a cada um: <b>Pedido normal</b> = média do que leva quando compra; <b>½ gap</b> e <b>Gap</b> = metade ou tudo o que deixou de comprar no ano.</div></div></div>
        <div class="tools"><div class="seg" id="plseg"></div><button class="linkbtn" id="pltodos">Pedido normal em todos da lista</button><button class="linkbtn" id="pllimpa">Limpar plano</button></div>
        <div class="tbl"><table id="plcli"></table></div></div>`);

    const planejado = () => { const pf = {}; let t=0; R.cands.forEach(x=>{ const v=marc.get(x.k)||0; if(v>0){ pf[x.f]=(pf[x.f]||0)+v; t+=v; } }); return {pf, t}; };
    function resumo(){
      const pl = planejado(), alvo = mTotal, tot = vendidoTot + pl.t;
      const w = v => alvo ? Math.min(v/alvo,1)*100 : 0;
      el("plresumo").innerHTML = `<div class="pl-big">${brl0(tot)} <span style="font-size:15px;font-weight:600;color:var(--muted)">de ${alvo?brl0(alvo):"meta sem dado"}</span></div>
        <div class="pl-bar"><i class="v" style="width:${w(vendidoTot)}%"></i><i class="p" style="width:${Math.max(w(tot)-w(vendidoTot),0)}%"></i></div>
        <div class="pl-leg"><span style="--c:var(--good)">Vendido ${brl0(vendidoTot)}</span><span style="--c:var(--accent)">Planejado ${brl0(pl.t)} (${marc.size} ${marc.size===1?"cliente":"clientes"})</span>
        ${alvo?`<span style="--c:var(--track)">${tot>=alvo?`<b class="pos">Meta coberta</b>`:`Falta encontrar <b>${brl0(alvo-tot)}</b>`}</span>`:""}</div>`;
      el("plfam").innerHTML = `<thead><tr><th class="l">Família</th><th>Sugestão</th><th>Mesmo mês ${ano-1}</th><th>Média 3 meses</th><th>Vendido</th><th>Planejado</th><th>Falta encontrar</th></tr></thead><tbody>`+
        PL_FAMS.map(([f])=>{ const sug=K.d[f]?K.d[f].valor:null, a=R.fam[f], p=pl.pf[f]||0, falta = ok(sug) ? sug-a.agora-p : null;
          return `<tr><td class="l">${PL_ROT[f]||f}</td><td><b>${ok(sug)?brl0(sug):"–"}</b></td><td>${brl0(a.ly)}</td><td>${brl0(a.m3)}</td><td>${brl0(a.agora)}</td><td>${brl0(p)}</td>
            <td class="${falta===null?"":falta>0?"neg":"pos"}">${falta===null?"–":falta>0?brl0(falta):"coberta"}</td></tr>`; }).join("")+`</tbody>`;
    }
    function lista(){
      const cont = {todas:R.cands.length}; R.cands.forEach(x=>cont[x.f]=(cont[x.f]||0)+1);
      el("plseg").innerHTML = [["todas","Todas"],...PL_FAMS.filter(([f])=>cont[f]).map(([f])=>[f,PL_ROT[f]||f])].map(([id,r])=>`<button data-f="${id}" class="${filtro===id?"on":""}">${r} (${cont[id]||0})</button>`).join("");
      const vis = R.cands.filter(x=>filtro==="todas"||x.f===filtro);
      const chip = (x,v,rot) => `<button class="plchip${Math.round(marc.get(x.k)||0)===Math.round(v)?" on":""}" data-k="${x.k}" data-v="${Math.round(v)}" title="${brl0(v)}">${rot}</button>`;
      el("plcli").innerHTML = `<thead><tr><th class="l">Vou vender (R$)</th><th class="l">Cliente</th><th class="l">Família</th><th>Gap no ano</th><th class="l">Por quê</th><th>Pedido normal</th><th class="l">Última compra</th></tr></thead><tbody>`+
        (vis.length ? vis.map(x=>`<tr class="${marc.get(x.k)>0?"no-plano":""}"><td class="l plv"><input type="text" inputmode="numeric" class="plin" data-k="${x.k}" value="${marc.get(x.k)>0?Math.round(marc.get(x.k)).toLocaleString("pt-BR"):""}" placeholder="–" aria-label="Quanto espera vender">
            <div class="plchips">${chip(x,x.valor,"Pedido normal")}${x.gap>0?chip(x,x.gap/2,"½ gap")+chip(x,x.gap,"Gap"):""}</div></td>
          <td class="l nome"><button class="linkbtn" data-cli="${x.c}" style="text-align:left">${esc(P.clientes[x.c][1])}</button><div class="cod">${P.clientes[x.c][0]} · ${isJ(x.c)?"CNPJ":"CPF"}${tagGrupo(x.c)}</div></td>
          <td class="l">${PL_ROT[x.f]||x.f}</td><td class="${x.gap>0?"neg":""}">${x.gap>0?"−"+brl0(x.gap):"–"}</td><td class="l why">${x.recente?'<span class="pill s-none">Pedido recente</span> ':""}${x.pq}</td><td>${brl0(x.valor)}</td><td class="l">${x.ult>=0?mesCurto(P.meses[x.ult]):"–"}</td></tr>`).join("")
          : `<tr><td colspan="7" class="empty">Nenhum cliente nesta família.</td></tr>`)+`</tbody>`;
    }
    const tabela = () => [["Cliente","Código","Tipo","Família","Vou vender","Gap no ano","Pedido normal","Por quê","Última compra"],
      ...R.cands.filter(x=>marc.get(x.k)>0).map(x=>[P.clientes[x.c][1], P.clientes[x.c][0], isJ(x.c)?"CNPJ":"CPF", PL_ROT[x.f]||x.f, Math.round(marc.get(x.k)), Math.round(x.gap*100)/100, Math.round(x.valor*100)/100, x.pq, x.ult>=0?mesCurto(P.meses[x.ult]):""])];
    const celula = v => typeof v==="number" ? String(v).replace(".",",") : String(v);
    el("plseg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; filtro=b.dataset.f; lista(); });
    const poe = (k,v,tr) => { v>0 ? marc.set(k,v) : marc.delete(k); plGravar(marc); resumo();
      if(tr){ tr.classList.toggle("no-plano", v>0); tr.querySelector(".plin").value = v>0 ? Math.round(v).toLocaleString("pt-BR") : "";
        tr.querySelectorAll(".plchip").forEach(b=>b.classList.toggle("on", v>0 && +b.dataset.v===Math.round(v))); } };
    el("plcli").addEventListener("click", e=>{ const b=e.target.closest(".plchip"); if(!b) return; const tr=b.closest("tr");
      poe(b.dataset.k, b.classList.contains("on") ? 0 : +b.dataset.v, tr); });   // tocar de novo no mesmo botão tira do plano
    el("plcli").addEventListener("change", e=>{ const i=e.target.closest(".plin"); if(!i) return;
      const v = parseFloat(i.value.replace(/[^\d,]/g,"").replace(",",".")) || 0; poe(i.dataset.k, v, i.closest("tr")); });
    el("pltodos").onclick = ()=>{ R.cands.filter(x=>filtro==="todas"||x.f===filtro).forEach(x=>{ if(!(marc.get(x.k)>0)) marc.set(x.k, Math.round(x.valor)); }); plGravar(marc); lista(); resumo(); };
    el("pllimpa").onclick = ()=>{ marc.clear(); plGravar(marc); lista(); resumo(); };
    el("plcopiar").onclick = ()=>{ const b=el("plcopiar"), txt=tabela().map(l=>l.map(celula).join("\t")).join("\n");
      const ok_=()=>{ b.innerHTML=`${ICON.copiar} Copiado. Cole no Excel`; setTimeout(()=>{ b.innerHTML=`${ICON.copiar} Copiar para o Excel`; },2500); };
      try{ navigator.clipboard.writeText(txt).then(ok_, ()=>{ b.textContent="Não deu para copiar: use Baixar planilha"; }); }catch(e){ b.textContent="Não deu para copiar: use Baixar planilha"; } };
    el("plbaixar").onclick = ()=>{ const csv = "\ufeff"+tabela().map(l=>l.map(v=>{ const t=celula(v); return /[;"\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t; }).join(";")).join("\r\n");
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download=`plano-${C.vendedor.split(" ")[0].toLowerCase()}-${C.mesRef}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); };
    function composicao(){
      const nome = f => PL_ROT[f]||f;
      const barra = campo => `<div class="cp-bar">${CP.map(([f,,cor])=>`<i style="width:${(K.d[f][campo]*100).toFixed(2)}%;background:${cor}" title="${nome(f)}: ${pct(K.d[f][campo],0)}"></i>`).join("")}</div>`;
      const motivo = o => o.g===null ? "linha nova: sem comparação com o ano passado"
        : o.g<=-0.02 ? `caiu ${pct(-o.g,0)} no ano: tem espaço para recuperar`
        : o.g>=0.02 ? `cresceu ${pct(o.g,0)} no ano: já está rendendo, a sugestão pesa um pouco menos`
        : "estável no ano";
      el("plcomp").innerHTML = `
        <div class="cp-lab">Como você vende (média ${mesCurto(P.meses[cur-12])} a ${mesCurto(P.meses[cur-1])}: ${brl0(K.t12)}/mês)</div>${barra("share")}
        <div class="cp-lab">Sugestão para a meta${mTotal?` de ${brl0(mTotal)}`:""}</div>${barra("sug")}
        ${CP.map(([f,k,cor])=>{ const o=K.d[f];
          return `<div class="cp-l"><i style="background:${cor}"></i><span><b>${nome(f)}</b> · costuma ${brl0(o.m12)} (${pct(o.share,0)})</span>
            <span class="v">${o.valor!==null?brl0(o.valor):pct(o.sug,0)}</span>
            <span class="d">${motivo(o)}</span></div>`; }).join("")}`;
    }
    resumo(); lista(); composicao();
  }

  // ========== TOP 20 ==========
  function topHTML(){
    // Maiores clientes do ano anterior inteiro (jan a dez) e como estão este ano
    const anoAnt = ano-1, ia = P.meses.indexOf(`${anoAnt}-01`), ib = P.meses.indexOf(`${anoAnt}-12`);
    if(ia<0 || ib<0) return `<div class="panel empty">sem dado: a planilha não tem o ano de ${anoAnt} completo</div>`;
    const tot = Array.from({length:NC+GRUPOS.length}, (_,c)=>soma(c,ia,ib));
    const total = tot.slice(0,NC).reduce((x,y)=>x+y,0);
    // grupos de filiais entram somados, no lugar das lojas
    const top = [...Array(NC).keys()].filter(c=>grupoDe[c]<0).concat(GRUPOS.map((g,i)=>NC+i))
      .filter(c=>tot[c]>0).sort((x,y)=>tot[y]-tot[x]).slice(0,20);
    const somaTop = top.reduce((x,c)=>x+tot[c],0);
    // Este ano até o último mês fechado, contra o mesmo período do ano passado
    const jan = P.meses.indexOf(`${ano}-01`), fech = cur-1, fechAnt = fech-12;
    const temComp = jan>=0 && fech>=jan;
    let acc = 0, caindo = 0, perdeu = 0;
    const rows = top.map((c,i)=>{ acc += tot[c];
      const agora = temComp ? soma(c,jan,fech) : null, antes = temComp ? soma(c,ia,fechAnt) : null;
      const v = ok(agora)&&ok(antes)&&antes>0 ? agora/antes-1 : null;
      if(v!==null && v<0){ caindo++; perdeu += antes-agora; }
      const comp = (ag,an) => { const w = ok(ag)&&ok(an)&&an>0 ? ag/an-1 : null;
        return temComp?`<td>${brl0(ag)}</td><td class="${w===null?"":w<0?"neg":"pos"}">${w===null?"–":(w>0?"+":"")+pct(w,0)}</td><td class="${ag-an<0?"neg":"pos"}">${ag-an<0?"−":"+"}${brl0(Math.abs(ag-an))}</td>`:""; };
      // grupo: a etiqueta "X filiais" abre/fecha as filiais logo abaixo (cada filial abre a própria ficha)
      const nome = ehGrupo(c) ? `${esc(nomeDe(c))} <button class="pill fil filtog" data-fil="${c}" aria-expanded="false">${GRUPOS[c-NC].cs.length} filiais ▾</button><div class="cod">Cliente principal · toque nas filiais para abrir</div>` : nomeCli(c);
      const filiais = ehGrupo(c) ? [...GRUPOS[c-NC].cs].sort((x,y)=>tot[y]-tot[x]).map(f=>`<tr class="click fsub fechada" data-of="${c}" tabindex="0" data-cli="${f}"><td></td><td class="l nome">↳ ${esc(P.clientes[f][1])}<div class="cod">${P.clientes[f][0]} · ${isJ(f)?"CNPJ":"CPF"}</div></td><td>${brl0(tot[f])}</td><td>${pct(tot[f]/total)}</td><td></td>${comp(temComp?soma(f,jan,fech):null, temComp?soma(f,ia,fechAnt):null)}</tr>`).join("") : "";
      return `<tr class="click" tabindex="0" data-cli="${c}"><td>${i+1}º</td><td class="l nome">${nome}</td><td>${brl0(tot[c])}</td><td>${pct(tot[c]/total)}</td><td>${pct(acc/total,0)}</td>
        ${comp(agora,antes)}</tr>${filiais}`; }).join("");
    const perEste = temComp ? `jan a ${mesCurto(P.meses[fech])}` : "";
    return `
      <h2 style="margin:4px 0 6px">Top 20 clientes de ${anoAnt} <span style="text-transform:none;letter-spacing:0;font-weight:500">· ano inteiro e como estão em ${ano}</span></h2>
      <p class="lead">Seus 20 maiores clientes de ${anoAnt} somaram <b>${brl0(somaTop)}</b>, <b>${pct(somaTop/total,0)}</b> de tudo que você vendeu no ano.${caindo?` <b>${caindo}</b> deles estão comprando menos em ${ano} do que no mesmo período de ${anoAnt}: juntos, deixaram de comprar <b class="neg">${brl0(perdeu)}</b>.`:""}</p>
      <div class="panel tbl"><table><thead><tr><th>#</th><th class="l">Cliente</th><th>${anoAnt}</th><th>% da venda</th><th>Acumulado</th>${temComp?`<th>${ano} (${perEste})</th><th>vs mesmo período ${anoAnt}</th><th>Diferença (R$)</th>`:""}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ========== SEM COMPRA NO MÊS ==========
  function drawSem(){
    let filtro = "J", jan = "todos";
    const pos = mt("pos"), faltaPos = ok(pos.meta)?Math.max(pos.meta-pos.real,0):null;
    section(`
      <div class="head"><div><h1>Sem compra no mês</h1><div class="sub" id="semsub"></div></div></div>
      <p class="lead" id="semlead"></p>
      <div class="panel">
        <div class="tools">
          <div class="seg" id="semjan" role="group" aria-label="Compraram nos últimos"><button data-j="todos" class="on">Todos</button><button data-j="3">3 a 5 meses sem comprar</button><button data-j="6">6 meses ou mais</button></div>
          <div class="seg" id="semtipo" role="group" aria-label="Tipo de cliente"><button data-f="J" class="on">Só CNPJ (conta na positivação)</button><button data-f="T">CNPJ + CPF</button></div>
        </div>
        <div class="tbl"><table><thead><tr><th class="l">Cliente</th><th>Média/mês</th><th>Última compra</th><th>Sem comprar há</th><th class="l">O que mais compra</th></tr></thead><tbody id="sembody"></tbody></table></div>
      </div>`);
    const draw = () => {
      const base = semLista(jan), l = base.filter(c=>filtro==="T"||isJ(c));
      const [fa,fb] = FAIXAS_SEM[jan];
      el("semsub").textContent = jan==="todos" ? `Compraram de ${mesCurto(P.meses[cur-12])} a ${mesCurto(P.meses[cur-1])} e ainda não compraram em ${MES_NOME[mes-1]}`
        : `Última compra entre ${mesCurto(P.meses[cur-fb])} e ${mesCurto(P.meses[cur-fa])}: sem comprar há ${fa} ${jan==="6"?"meses ou mais":"a "+fb+" meses"}`;
      el("semlead").innerHTML = `<b>${base.filter(isJ).length}</b> clientes CNPJ estão nessa lista. ` +
        (faltaPos>0 ? `Você precisa de mais <b>${faltaPos}</b> para bater a meta de positivação. Comece pelos de cima: são os que mais compram por mês.` : ok(pos.meta) ? `Sua meta de positivação já está batida. Cada cliente daqui ainda soma venda.` : `Cada cliente daqui que comprar conta na positivação do mês.`);
      el("sembody").innerHTML = l.length ? l.map(c=>{ const u=ultimaCompra(c);
        return `<tr class="click" tabindex="0" data-cli="${c}"><td class="l nome">${nomeCli(c)}</td><td>${brl0(soma(c,cur-12,cur-1)/12)}</td><td>${u>=0?mesCurto(P.meses[u]):"–"}</td><td>${mesesSem(c)} ${mesesSem(c)===1?"mês":"meses"}</td><td class="l nome mini">${topProdutos(c,2).map(esc).join("<br>")}</td></tr>`; }).join("")
        : `<tr><td colspan="5" class="empty">Nenhum cliente nessa situação.</td></tr>`;
    };
    el("semjan").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
      jan=b.dataset.j; e.currentTarget.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
    el("semtipo").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return;
      filtro=b.dataset.f; e.currentTarget.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); draw(); });
    draw();
  }

  // ========== ANALÍTICO ==========
  // Tabela dinâmica, como no Excel: filtra cliente, família, produto e meses; compara com o ano anterior.
  // Valor = "Venda - Valor". Unidades = "Faturamento - Quantidade de Itens Líquida".
  const FAM_LISTA = [...new Set(P.produtos.map(p=>p[3]||"Outros"))].sort((a,b)=>a.localeCompare(b));
  const cliRot = c => ehGrupo(c) ? `Grupo ${GRUPOS[c-NC].nome} (${GRUPOS[c-NC].cs.length} filiais)` : `${P.clientes[c][1]} · ${P.clientes[c][0]}`;
  const anCli = r => AN.cli===null || (ehGrupo(AN.cli) ? grupoDe[r[0]]===AN.cli-NC : r[0]===AN.cli);
  const AN = { cli:null, fam:"", prod:"", de:Math.max(cur-(mes-1),0), ate:cur, comparar:true, medida:"valor", linhas:"produto", visao:"comp", ord:null, dir:-1 };

  function drawAnalitico(opts){
    if(ok(opts.cli)){ AN.cli = opts.cli; AN.prod = ""; }
    const opMes = sel => P.meses.map((k,i)=>`<option value="${i}" ${i===sel?"selected":""}>${mesCurto(k)}</option>`).join("");
    section(`
      <div class="head"><div><h1>Analítico</h1><div class="sub">Monte sua consulta: escolha o cliente, a família, o produto e os meses</div></div>
        <button class="btn" id="ancopiar">${ICON.copiar} Copiar para o Excel</button></div>
      <div class="panel anf">
        <label class="f wide s4"><span>Cliente</span>
          <span class="combo"><input type="search" id="ancli" list="anclis" placeholder="Todos os clientes (digite cliente ou grupo)" autocomplete="off"><datalist id="anclis">${[...Array(NC+GRUPOS.length).keys()].sort((a,b)=>cliRot(a).localeCompare(cliRot(b))).map(c=>`<option value="${esc(cliRot(c))}"></option>`).join("")}</datalist></span></label>
        <label class="f s3"><span>Família</span><select id="anfam"><option value="">Todas</option>${FAM_LISTA.map(f=>`<option value="${esc(f)}">${f==="Nobivac"?"Nobivac (vacinas)":esc(f)}</option>`).join("")}</select></label>
        <label class="f wide s5"><span>Produto</span><select id="anprod"></select></label>
        <label class="f"><span>De</span><select id="ande">${opMes(AN.de)}</select></label>
        <label class="f"><span>Até</span><select id="anate">${opMes(AN.ate)}</select></label>
        <label class="f"><span>Linhas por</span><select id="anlin"><option value="produto">Produto</option><option value="familia">Família</option><option value="mes">Mês</option><option value="cliente">Cliente</option></select></label>
        <div class="f"><span>Mostrar em</span><div class="seg" id="anmed"><button data-v="valor">R$ Valor</button><button data-v="unid">Unidades</button></div></div>
        <div class="f"><span>Visão</span><div class="seg" id="anvis"><button data-v="comp">Comparativo</button><button data-v="mes">Mês a mês</button></div></div>
        <label class="f chk wide"><input type="checkbox" id="ancomp"> <span>Comparar com o mesmo período do ano anterior</span></label>
        <button class="linkbtn" id="anlimpar">Limpar filtros</button>
      </div>
      <section class="anres" id="anres"></section>
      <div class="panel"><div class="tbl antbl"><table id="antab"></table></div></div>`);
    const cliMap = new Map([...Array(NC+GRUPOS.length).keys()].map(c=>[cliRot(c),c]));
    el("ancli").value = AN.cli===null ? "" : cliRot(AN.cli);
    el("anfam").value = AN.fam; el("anlin").value = AN.linhas; el("ancomp").checked = AN.comparar;
    const syncSeg = () => { el("anmed").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===AN.medida));
                            el("anvis").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===AN.visao)); };
    const prodOpts = () => {
      const usados = new Set(); P.vendas.forEach(r=>{ if(anCli(r) && (!AN.fam||famDe(r[1])===AN.fam)) usados.add(r[1]); });
      const l = [...usados].sort((a,b)=>P.produtos[a][0].localeCompare(P.produtos[b][0]));
      if(AN.prod!=="" && !usados.has(+AN.prod)) AN.prod = "";
      el("anprod").innerHTML = `<option value="">Todos (${l.length})</option>`+l.map(p=>`<option value="${p}">${esc(P.produtos[p][0])}</option>`).join("");
      el("anprod").value = AN.prod;
    };
    el("ancli").addEventListener("change", e=>{ const v=e.target.value.trim(); AN.cli = v===""?null:(cliMap.has(v)?cliMap.get(v):AN.cli); e.target.value = AN.cli===null?"":cliRot(AN.cli); prodOpts(); calc(); });
    el("ancli").addEventListener("input", e=>{ const v=e.target.value.trim(); if(v===""){ AN.cli=null; prodOpts(); calc(); } else if(cliMap.has(v)){ AN.cli=cliMap.get(v); prodOpts(); calc(); } });
    el("anfam").addEventListener("change", e=>{ AN.fam=e.target.value; prodOpts(); calc(); });
    el("anprod").addEventListener("change", e=>{ AN.prod=e.target.value; calc(); });
    el("ande").addEventListener("change", e=>{ AN.de=+e.target.value; if(AN.de>AN.ate){ AN.ate=AN.de; el("anate").value=AN.ate; } calc(); });
    el("anate").addEventListener("change", e=>{ AN.ate=+e.target.value; if(AN.ate<AN.de){ AN.de=AN.ate; el("ande").value=AN.de; } calc(); });
    el("anlin").addEventListener("change", e=>{ AN.linhas=e.target.value; AN.ord=null; calc(); });
    el("ancomp").addEventListener("change", e=>{ AN.comparar=e.target.checked; calc(); });
    el("anmed").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ AN.medida=b.dataset.v; syncSeg(); calc(); } });
    el("anvis").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b){ AN.visao=b.dataset.v; AN.ord=null; syncSeg(); calc(); } });
    el("anlimpar").addEventListener("click", ()=>{ Object.assign(AN,{cli:null,fam:"",prod:"",de:Math.max(cur-(mes-1),0),ate:cur,comparar:true,linhas:"produto",ord:null,dir:-1}); drawAnalitico({}); });
    el("antab").addEventListener("click", e=>{
      const cb=e.target.closest("[data-anc]"); if(cb){ AN.cli=+cb.dataset.anc; AN.linhas="produto"; AN.ord=null; drawAnalitico({}); return; }
      const th=e.target.closest("th[data-k]"); if(!th) return; const k=th.dataset.k;
      if(AN.ord===k) AN.dir*=-1; else { AN.ord=k; AN.dir = k==="nome"?1:-1; } calc(); });
    el("ancopiar").addEventListener("click", copiar);
    syncSeg(); prodOpts(); calc();
  }

  let anUltima = null;   // última tabela montada (para copiar)
  function calc(){
    const podeComp = AN.comparar && AN.de-12>=0 && AN.visao==="comp";
    const med = AN.medida==="valor" ? 3 : 4, fmt = AN.medida==="valor" ? brl0 : (v=>ok(v)?Math.round(v).toLocaleString("pt-BR"):"–");
    const chave = r => AN.linhas==="produto" ? "p"+r[1] : AN.linhas==="familia" ? famDe(r[1]) : AN.linhas==="cliente" ? "c"+r[0] : null;
    const nomeLin = k => AN.linhas==="produto" ? P.produtos[+k.slice(1)][0] : AN.linhas==="cliente" ? P.clientes[+k.slice(1)][1] : (k==="Nobivac"?"Nobivac (vacinas)":k);
    const passa = r => anCli(r) && (!AN.fam||famDe(r[1])===AN.fam) && (AN.prod===""||r[1]===+AN.prod);
    const nMes = AN.ate-AN.de+1;
    const linhas = new Map(); let tA=0, tB=0; const tMes = new Float64Array(nMes);
    const pega = k => { if(!linhas.has(k)) linhas.set(k,{k, a:0, b:0, m:new Float64Array(nMes)}); return linhas.get(k); };
    P.vendas.forEach(r=>{
      if(!passa(r)) return;
      const m=r[2], v=r[med];
      if(m>=AN.de && m<=AN.ate){
        const k = AN.linhas==="mes" ? "m"+m : chave(r), o = pega(k);
        o.a += v; o.m[m-AN.de] += v; tA += v; tMes[m-AN.de] += v;
      } else if(podeComp && m>=AN.de-12 && m<=AN.ate-12){
        const k = AN.linhas==="mes" ? "m"+(m+12) : chave(r); pega(k).b += v; tB += v;
      }
    });
    if(AN.linhas==="mes") for(let m=AN.de;m<=AN.ate;m++) pega("m"+m);
    let rows = [...linhas.values()].map(o=>({...o, nome: AN.linhas==="mes" ? mesCurto(P.meses[+o.k.slice(1)]) : nomeLin(o.k), dif:o.a-o.b, pc:o.b>0?o.a/o.b-1:null, sh:tA>0?o.a/tA:0}));
    if(AN.linhas!=="mes") rows = rows.filter(o=>o.a!==0||o.b!==0);
    const ord = AN.ord || (AN.linhas==="mes" ? "idx" : "a");
    const val = o => ord==="nome"?o.nome : ord==="idx"?+o.k.slice(1) : ord.startsWith("m")?o.m[+ord.slice(1)] : (o[ord]??-Infinity);
    rows.sort((x,y)=>{ const a=val(x), b=val(y); const d = typeof a==="string" ? a.localeCompare(b) : a-b; return (AN.ord?AN.dir:(ord==="idx"?1:-1))*d; });

    // resumo
    const per = (a,b) => a===b ? mesCurto(P.meses[a]) : `${mesCurto(P.meses[a])} a ${mesCurto(P.meses[b])}`;
    const filtros = [AN.cli===null?"Todos os clientes":esc(nomeDe(AN.cli)), AN.fam?esc(AN.fam):"Todas as famílias", AN.prod!==""?esc(P.produtos[+AN.prod][0]):"Todos os produtos"];
    const vt = tB>0 ? tA/tB-1 : null;
    const cardA = `<div class="kpi"><div class="lab">${per(AN.de,AN.ate)}</div><div class="val">${fmt(tA)}</div><div class="det">${filtros.join(" · ")}</div></div>`;
    el("anres").innerHTML = `
      ${podeComp?`<div class="kpi"><div class="lab">${per(AN.de-12,AN.ate-12)}</div><div class="val">${fmt(tB)}</div><div class="det">Mesmo período do ano anterior</div></div>
      ${cardA}
      <div class="kpi"><div class="lab">Diferença</div><div class="val ${tA-tB<0?"neg":"pos"}">${tA-tB<0?"−":"+"}${fmt(Math.abs(tA-tB))}</div><div class="det">${vt===null?"sem base no ano anterior":`<span class="${vt<0?"down":"up"}">${vt<0?"↓":"↑"} ${pct(Math.abs(vt))}</span> contra o ano anterior`}</div></div>`
      : `${cardA}<div class="kpi"><div class="lab">Média por mês</div><div class="val">${fmt(tA/nMes)}</div><div class="det">${nMes} ${nMes>1?"meses":"mês"}${AN.comparar&&AN.visao==="comp"&&AN.de-12<0?" · sem dado do ano anterior para comparar":""}${AN.visao==="mes"?" · comparação desligada na visão mês a mês":""}</div></div>`}`;

    // tabela
    const rotLin = {produto:"Produto", familia:"Família", mes:"Mês", cliente:"Cliente"}[AN.linhas];
    const seta = k => AN.ord===k ? (AN.dir>0?" ▲":" ▼") : "";
    const th = (k,t,cls) => `<th data-k="${k}" class="${cls||""}" title="Ordenar">${t}${seta(k)}</th>`;
    let head, body, foot, tsv;
    if(AN.visao==="mes"){
      const ms = [...Array(nMes).keys()];
      head = `<tr>${th("nome",rotLin,"l")}${ms.map(i=>th("m"+i,mesCurto(P.meses[AN.de+i]))).join("")}${th("a","Total")}</tr>`;
      body = rows.map(o=>`<tr>${tdNome(o)}${ms.map(i=>`<td>${o.m[i]?fmt(o.m[i]):'<span class="mini">–</span>'}</td>`).join("")}<td><b>${fmt(o.a)}</b></td></tr>`).join("");
      foot = `<tr><td class="l">Total</td>${ms.map(i=>`<td>${fmt(tMes[i])}</td>`).join("")}<td>${fmt(tA)}</td></tr>`;
      tsv = [[rotLin,...ms.map(i=>mesCurto(P.meses[AN.de+i])),"Total"], ...rows.map(o=>[o.nome,...ms.map(i=>o.m[i]),o.a]), ["Total",...ms.map(i=>tMes[i]),tA]];
    } else {
      head = `<tr>${th("nome",rotLin,"l")}${podeComp?th("b",per(AN.de-12,AN.ate-12)):""}${th("a",per(AN.de,AN.ate))}${podeComp?th("dif","Diferença")+th("pc","%"):""}${th("sh","% do total")}</tr>`;
      body = rows.map(o=>`<tr>${tdNome(o)}${podeComp?`<td>${fmt(o.b)}</td>`:""}<td><b>${fmt(o.a)}</b></td>${podeComp?`<td class="${o.dif<0?"neg":o.dif>0?"pos":""}">${o.dif<0?"−":o.dif>0?"+":""}${fmt(Math.abs(o.dif))}</td><td class="${o.pc<0?"neg":o.pc>0?"pos":""}">${o.pc===null?(o.a>0?"novo":"–"):(o.pc>0?"+":"")+pct(o.pc,0)}</td>`:""}<td class="mini">${tA>0?pct(o.a/tA):"–"}</td></tr>`).join("");
      foot = `<tr><td class="l">Total</td>${podeComp?`<td>${fmt(tB)}</td>`:""}<td>${fmt(tA)}</td>${podeComp?`<td class="${tA-tB<0?"neg":"pos"}">${tA-tB<0?"−":"+"}${fmt(Math.abs(tA-tB))}</td><td>${vt===null?"–":(vt>0?"+":"")+pct(vt,0)}</td>`:""}<td>100%</td></tr>`;
      tsv = [[rotLin, ...(podeComp?[per(AN.de-12,AN.ate-12)]:[]), per(AN.de,AN.ate), ...(podeComp?["Diferença","%"]:[])], ...rows.map(o=>[o.nome,...(podeComp?[o.b]:[]),o.a,...(podeComp?[o.dif,o.pc===null?"":pct(o.pc,1)]:[])]), ["Total",...(podeComp?[tB]:[]),tA,...(podeComp?[tA-tB,vt===null?"":pct(vt,1)]:[])]];
    }
    el("antab").innerHTML = rows.length ? `<thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot>`
      : `<tbody><tr><td class="empty">Nenhuma venda com esses filtros no período.</td></tr></tbody>`;
    anUltima = rows.length ? tsv : null;
  }
  function tdNome(o){
    if(AN.linhas==="cliente"){ const c=+o.k.slice(1); return `<td class="l nome"><button class="linkbtn" data-anc="${c}">${esc(P.clientes[c][1])}</button><div class="cod">${P.clientes[c][0]}</div></td>`; }
    if(AN.linhas==="produto"){ const p=+o.k.slice(1); return `<td class="l nome">${esc(P.produtos[p][0])}<div class="cod">${esc(famDe(p))}</div></td>`; }
    return `<td class="l">${esc(o.nome)}</td>`;
  }
  function copiar(){
    const b = el("ancopiar"); if(!anUltima){ return; }
    const txt = anUltima.map(l=>l.map(v=>typeof v==="number" ? String(Math.round(v*100)/100).replace(".",",") : String(v)).join("\t")).join("\n");
    const ok_ = () => { b.innerHTML = `${ICON.copiar} Copiado. Cole no Excel`; setTimeout(()=>{ b.innerHTML = `${ICON.copiar} Copiar para o Excel`; },2500); };
    try{ navigator.clipboard.writeText(txt).then(ok_, ()=>fallback(txt)); }catch(e){ fallback(txt); }
    function fallback(t){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); ok_(); }catch(e){ b.textContent="Selecione e copie a tabela manualmente"; } ta.remove(); }
  }

  const h = (location.hash||"").slice(1);
  ir(SECOES.some(s=>s.id===h) ? h : "mes");
})();
</script>

</body>
</html>
