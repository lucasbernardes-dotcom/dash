const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha, lembrar){
  const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.sal), iterations:D.it, hash:"SHA-256"}, k0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.ct)));
  if(lembrar){ try{ sessionStorage.setItem("gerencial_auth", senha); }catch(e){} }
  document.open(); document.write(html); document.close();
}
const s = document.getElementById("s"), e = document.getElementById("e"), b = document.getElementById("b");
async function entrar(){
  b.disabled = true; e.textContent = "";
  try{ await abrir(s.value, true); }
  catch(x){ e.textContent = "Senha incorreta"; s.value = ""; s.focus(); b.disabled = false; }
}
b.onclick = entrar;
s.addEventListener("keydown", ev => { if(ev.key === "Enter") entrar(); });
try{ const g = sessionStorage.getItem("gerencial_auth"); if(g) abrir(g, false).catch(()=>sessionStorage.removeItem("gerencial_auth")); }catch(x){}
</script>
