.brand{display:flex;align-items:center;gap:10px;padding:0 4px;font-weight:700;font-size:16px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand .logo svg{width:18px;height:18px;stroke-width:2.2}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sbusca{position:relative;display:block}
.sbusca input[type=search]{max-width:none;width:100%;font:inherit;font-size:13px;padding:9px 10px 9px 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sbusca input:focus{outline:2px solid var(--accent);outline-offset:0}
.sbusca svg{position:absolute;z-index:1;pointer-events:none;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.navlab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:650;padding:0 8px;margin-bottom:-8px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:9px 10px;color:var(--muted);cursor:pointer;font-size:14px}
nav button:hover{background:var(--surface);color:var(--ink)}
nav button.on{background:var(--nav-bg);border-color:var(--nav-line);color:var(--nav-on);font-weight:650;box-shadow:0 0 18px -6px var(--accent-glow)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav .cnt{margin-left:auto;font-size:11px;background:var(--surface2);color:var(--muted);padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
nav button.on .cnt{background:var(--brand);color:var(--brand-ink)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent-2));color:var(--accent-ink);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none}
.me b{display:block;font-size:13.5px}
.me span{font-size:11.5px;color:var(--muted)}

main{padding:22px 26px 36px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;max-width:1240px;width:100%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px}
.hello{font-size:13px;color:var(--muted);margin-bottom:2px}
h1{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance;font-weight:700}
.sub{color:var(--muted);font-size:13px}
h2{margin:0;font-size:15px;font-weight:650;color:var(--ink)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ph .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 9px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lead{margin:0;color:var(--muted);max-width:75ch}
.lead b{color:var(--ink)}

.rankpill{display:inline-flex;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);border-radius:99px;padding:6px 14px;font-weight:650;font-size:13px}
.rankpill .big{font-size:18px}

/* KPIs com ícone e minigráfico */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .icb{width:36px;height:36px;border-radius:50%;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi .val{font-size:27px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .det{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.kpi .spark{margin-top:auto;padding-top:6px}
.kpi .spark svg{width:100%;height:46px;display:block}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;white-space:nowrap}
.s-good{color:var(--good);background:var(--good-bg)} .s-warn{color:var(--warn);background:var(--warn-bg)} .s-bad{color:var(--bad);background:var(--bad-bg)} .s-none{color:var(--muted);background:var(--surface2)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.daysbar{display:flex;gap:3px;margin-top:auto;padding-top:12px}
.daysbar i{flex:1;height:8px;border-radius:3px;background:var(--track)}
.daysbar i.on{background:var(--accent)}

/* Linhas de gráficos */
.row2{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.mb{cursor:pointer}
.mb .br{transition:opacity .15s}
.mb:hover .br{opacity:.85}
.mb .vl{opacity:0;pointer-events:none;transition:opacity .12s}
.mb.sel .vl,.mb:hover .vl{opacity:1}
.chart svg:hover .mb.sel:not(:hover) .vl{opacity:0}
.mb.sel .br{opacity:1}
.mb.sel .ml{fill:var(--accent);font-weight:650}
.mb:focus{outline:none} .mb:focus-visible .br{stroke:var(--ink);stroke-width:2}
.donut{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut svg{width:150px;height:150px}
.dleg{display:grid;gap:8px;font-size:13px}
.dleg div{display:grid;grid-template-columns:10px 1fr auto 46px;gap:8px;align-items:center}
.rk{display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--muted)}
.rk svg{width:12px;height:12px;stroke-width:2.2}
.rk.r1{background:rgba(234,179,8,.18);color:#F5CF5A} .rk.r2{background:rgba(203,213,225,.16);color:#DCE3EA} .rk.r3{background:rgba(217,119,6,.2);color:#E9A56A}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg span.v{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}

/* Metas estilo lista */
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.mg{grid-column:1/-1;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:650;margin-top:8px}
.mg:first-child{margin-top:0}
.mi{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mi .icb{width:34px;height:34px;border-radius:50%;background:var(--surface2);color:var(--accent);display:grid;place-items:center}
.mi .icb svg{width:16px;height:16px}
.mi .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mi .t b{font-size:13.5px;font-weight:600}
.mi .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.p.good{color:var(--good)} .p.warn{color:var(--warn)} .p.bad{color:var(--bad)} .p.none{color:var(--muted);font-weight:600;font-size:12px}
.mi .l{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.mi .l b{color:var(--ink);font-weight:600}
.bar{position:relative;height:7px;background:var(--track);border-radius:4px;margin-top:6px}
.bar .fill{height:100%;border-radius:4px}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}

/* Clientes para visitar */
.calls{display:grid;gap:2px}
.call{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.call:hover{background:var(--surface2)}
.call:focus-visible{outline:2px solid var(--accent)}
.call .ini{width:34px;height:34px;border-radius:50%;background:var(--surface2);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.call b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.call span{font-size:11.5px;color:var(--muted)}
.call .v{font-size:12px;color:var(--warn);font-weight:600;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:2px;height:10px;background:var(--ink);opacity:.55;vertical-align:-1px;margin-right:4px}

/* Tabelas */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;position:sticky;top:0;background:var(--surface)}
th.l,td.l{text-align:left}
td.nome{white-space:normal;min-width:180px;max-width:320px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.cod{color:var(--muted);font-size:11px}
.clu{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.clu.OURO{background:rgba(234,179,8,.18);color:#F5CF5A} .clu.PRATA{background:rgba(203,213,225,.14);color:#CBD5E1} .clu.BRONZE{background:rgba(217,119,6,.18);color:#E9A56A}
.neg{color:var(--bad)} .pos{color:var(--good)}
.mini{font-size:12px;color:var(--muted)}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{font-size:12px;padding:5px 12px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:99px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.seg button:focus-visible,.linkbtn:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);width:100%;max-width:420px}
select{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface2);color:var(--ink);cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}

/* Clientes */
.cli-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
#clisel{flex:1 1 320px;max-width:100%;min-width:0} #busca{flex:0 1 240px;min-width:0}
.cli-list{max-height:calc(100vh - 210px);overflow:auto}
.cli-detail .dh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start}
.cli-detail h3{margin:0;font-size:18px;text-wrap:balance}
.cli-detail h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-size:15px;font-variant-numeric:tabular-nums}
.back{display:none}
.empty{padding:24px;text-align:center;color:var(--muted)}

@media (max-width:1150px){ .kpis{grid-template-columns:repeat(2,1fr)} .row2,.row3{grid-template-columns:1fr} .cli-wrap{grid-template-columns:1fr} .cli-list{max-height:none} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;padding:10px 12px 8px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .me,.side .navlab,.sbusca{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:7px 11px;font-size:13px}
  nav button svg{display:none}
  main{padding:16px 16px 28px}
  .mlist{grid-template-columns:1fr}
  .cli-wrap.aberto .cli-lado{display:none}
  .cli-wrap:not(.aberto) .cli-detail{display:none}
  .back{display:inline-block;margin-bottom:8px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:480px){ .kpis{grid-template-columns:1fr} .donut{grid-template-columns:1fr;justify-items:center} h1{font-size:20px} }
@media (prefers-reduced-motion:no-preference){ .bar .fill{transition:width .5s ease} }

/* Oportunidades */
.fams{display:grid;gap:2px}
.fam{display:grid;grid-template-columns:minmax(110px,1.1fr) 1.4fr 96px 48px;gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:10px;padding:8px 8px;cursor:pointer;text-align:left;width:100%}
.fam:hover:not(:disabled){background:var(--surface2)}
.fam.on{background:var(--accent-soft);border-color:var(--accent-line)}
.fam:first-child{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;margin-bottom:4px}
.fam.so{cursor:default;opacity:.75}
.fam:focus-visible{outline:2px solid var(--accent)}
.fam .fn{font-weight:600;font-size:13.5px}
.fam .fb{position:relative;height:10px;background:var(--track);border-radius:5px}
.fam .fb::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.fam .fb i{position:absolute;top:0;bottom:0;border-radius:5px}
.fam .fb i.neg{background:var(--bad)} .fam .fb i.pos{background:var(--good)}
.fam .fv{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:13px}
.fam .fp{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.op .call{grid-template-columns:34px 1fr auto}
/* Oportunidades: cliente aberto item por item */
tr.exp td{background:var(--surface2)}
tr.itens > td{padding:0 0 12px;background:var(--surface2)}
.itbox{padding:4px 12px 0 12px}
.itbox table{width:100%}
.itbox th,.itbox td{font-size:12.5px}
.itbox .un{display:block;font-size:11px;color:var(--muted)}
.itbox .rod{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.seta{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
tr.exp .seta{transform:rotate(90deg)}
.grp{color:var(--accent)}
.filtog{cursor:pointer;font-family:inherit}.filtog:hover{filter:brightness(1.25)}tr.fsub.fechada{display:none!important}tr.fsub td{font-size:.92em;opacity:.85}tr.fsub td.nome{padding-left:22px}
.pill.fil{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);font-size:11px;vertical-align:1px}
.itbox .itbox{padding:4px 0 0 10px;border-left:2px solid var(--accent-line)}
#oplista .tools{display:flex;gap:10px;flex-wrap:wrap}
/* Plano do mês */
.plv{min-width:150px}
.plin{width:110px;font:inherit;font-variant-numeric:tabular-nums;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.plin:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.plchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.plchip{font-size:11px;padding:2px 8px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;cursor:pointer;white-space:nowrap}
.plchip:hover{border-color:var(--accent);color:var(--ink)}
.plchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.pl-top{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.pl-top>*{min-width:0}
@media (max-width:1100px){ .pl-top{grid-template-columns:1fr} }
.pl-big{font-size:28px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pl-bar{position:relative;height:14px;background:var(--track);border-radius:7px;overflow:hidden;margin:10px 0 6px;display:flex}
.pl-bar i{display:block;height:100%}
.pl-bar i.v{background:var(--good)} .pl-bar i.p{background:var(--accent)}
.pl-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.pl-leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
input.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
tr.no-plano td{background:var(--accent-soft)}
.aviso{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px}
.why{font-size:11.5px;color:var(--muted)}
.cp-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:4px 0 10px}
.cp-bar i{display:block;height:100%}
.cp-lab{font-size:12px;color:var(--muted);font-weight:600}
.cp-l{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 8px;align-items:baseline;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.cp-l i{width:10px;height:10px;border-radius:3px;align-self:center}
.cp-l .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.cp-l .d{grid-column:2 / 4;font-size:11.5px;color:var(--muted)}
.call .v.neg{color:var(--bad)}
@media (max-width:560px){ .fam{grid-template-columns:1fr 70px 44px} .fam .fb{grid-column:1/-1;order:5} }

/* Analítico */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:650;cursor:pointer;font-size:13px}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.btn.sm svg{width:14px;height:14px}
.btn.sm.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.anf{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 14px;align-items:end}
.anf .f{grid-column:span 2}
.anf .s3{grid-column:span 3} .anf .s4{grid-column:span 4} .anf .s5{grid-column:span 5}
.anf .f{display:grid;gap:5px;min-width:0}
.anf .f>span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650}
.anf select,.anf input[type=search]{width:100%;max-width:none;border-radius:10px;padding:8px 10px;font-size:13px}
.anf .chk{grid-column:span 10;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer}
.anf .chk input{width:16px;height:16px;accent-color:var(--accent)}
.anf .chk span{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.anf #anlimpar{justify-self:end;align-self:center}
.anres{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.anres .val.neg{color:var(--bad)} .anres .val.pos{color:var(--good)}
.antbl{max-height:70vh;overflow:auto}
.antbl th[data-k]{cursor:pointer;user-select:none}
.antbl th[data-k]:hover{color:var(--accent)}
.antbl tfoot td{font-weight:700;position:sticky;bottom:0;background:var(--surface2)}
@media (max-width:1150px){ .anf{grid-template-columns:repeat(2,minmax(0,1fr))} .anf .f{grid-column:span 1} .anf .f.wide,.anf .chk{grid-column:1/-1} }
@media (max-width:560px){ .anres{grid-template-columns:1fr} }

/* Conquistas */
.lv{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.lv svg{width:13px;height:13px;stroke-width:2.2}

<script>
(function(){
  const C = CONFIG, P = PLANILHA;
  if(C.tema) document.documentElement.classList.add("tema-"+C.tema);
  const el = id => document.getElementById(id);
  const ok = v => typeof v==="number" && isFinite(v);
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const brl0 = v => !ok(v) ? "sem dado" : v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  const brl  = v => !ok(v) ? "sem dado" : v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const pct  = (v,d=1) => !ok(v) ? "sem dado" : (v*100).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
  const inteiro = v => !ok(v) ? "sem dado" : v.toLocaleString("pt-BR",{maximumFractionDigits:2});
  const MES_NOME = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const mesCurto = k => { const [a,m] = k.split("-").map(Number); return MES_NOME[m-1].slice(0,3)+"/"+String(a).slice(2); };
  const mesLongo = k => { const [a,m] = k.split("-").map(Number); return MES_NOME[m-1]+" de "+a; };

  // ---------- Ícones (desenhados aqui mesmo, sem internet) ----------
  const svg = s => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${s}</svg>`;
  const ICON = {
    home:      svg(`<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>`),
    pessoas:   svg(`<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14c2.5.6 4 2.8 4 6"/>`),
    estrela:   svg(`<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 3 1-6.2L3 9.7l6.2-.9z"/>`),
    telefone:  svg(`<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>`),
    queda:     svg(`<path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/>`),
    cifrao:    svg(`<path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`),
    alvo:      svg(`<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>`),
    calendario:svg(`<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>`),
    trofeu:    svg(`<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>`),
    box:       svg(`<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>`),
    pata:      svg(`<circle cx="6.5" cy="10" r="1.8"/><circle cx="10" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.5" cy="10" r="1.8"/><path d="M12 12c-3 0-5 3.5-5 5.5S9 20 12 20s5-.5 5-2.5-2-5.5-5-5.5z"/>`),
    seringa:   svg(`<path d="M18 2l4 4M17 7l3-3M19 9L9 19l-4 1 1-4L16 6zM9 11l4 4"/>`),
    pilula:    svg(`<path d="M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7z"/><path d="M7 10l7 7"/>`),
    frasco:    svg(`<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M7.5 15h9"/>`),
    gota:      svg(`<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>`),
    escudo:    svg(`<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>`),
    mais:      svg(`<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>`),
    medalha:   svg(`<circle cx="12" cy="15" r="6"/><path d="M8.5 10L6 3h4l2 4 2-4h4l-2.5 7"/>`),
    local:     svg(`<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>`),
    tabela:    svg(`<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11M15 9v11"/>`),
    copiar:    svg(`<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>`),
    busca:     svg(`<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>`),
    cruz:      svg(`<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>`)
  };

  // ---------- Índices básicos ----------
  const M = P.meses.length, cur = P.meses.indexOf(C.mesRef);
  const NC = P.clientes.length;
  const porCliMes = Array.from({length:NC}, ()=>new Float64Array(M));   // valor por cliente e mês
  const temLinha  = Array.from({length:NC}, ()=>new Uint8Array(M));     // teve linha de venda no mês
  const normTxt = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const linhasCli = Array.from({length:NC}, ()=>[]);
  P.vendas.forEach(r=>{ porCliMes[r[0]][r[2]] += r[3]; temLinha[r[0]][r[2]] = 1; linhasCli[r[0]].push(r); });
  const soma = (c,a,b) => { let s=0; for(let m=Math.max(a,0); m<=b; m++) s+=porCliMes[c][m]; return s; };
  const ultimaCompra = c => { for(let m=M-1; m>=0; m--) if(porCliMes[c][m]>0) return m; return -1; };
  const isJ = c => P.clientes[c][2]==="J";
  // Grupos de filiais (coluna Cliente Principal). Só entram as filiais deste RCA.
  // Cada grupo também vira um "cliente" de número NC+i em porCliMes/linhasCli, para soma() e ultimaCompra() servirem.
  const GRUPOS = (()=>{ const m = new Map();
    for(let c=0;c<NC;c++){ const g = P.clientes[c][4]; if(g) (m.get(g)||m.set(g,[]).get(g)).push(c); }
    return [...m].filter(([,l])=>l.length>1).map(([nome,cs])=>({nome, cs})); })();
  const grupoDe = new Int32Array(NC).fill(-1); GRUPOS.forEach((g,i)=>g.cs.forEach(c=>grupoDe[c]=i));
  GRUPOS.forEach(g=>{ const v=new Float64Array(M), l=[]; g.cs.forEach(c=>{ porCliMes[c].forEach((x,m)=>v[m]+=x); l.push(...linhasCli[c]); }); porCliMes.push(v); linhasCli.push(l); });
  const ehGrupo = c => c>=NC;
  const nomeDe = c => ehGrupo(c) ? GRUPOS[c-NC].nome : P.clientes[c][1];
  const doGrupo = c => grupoDe[c]>=0 ? NC+grupoDe[c] : null;
  const tagGrupo = c => { const g = grupoDe[c]; if(g<0) return "";
    return P.clientes[c][1]===GRUPOS[g].nome ? ` · <span class="grp">Matriz do grupo · ${GRUPOS[g].cs.length} filiais</span>` : ` · <span class="grp">Grupo ${esc(GRUPOS[g].nome)}</span>`; };
  const pillFil = g => `<span class="pill fil">${GRUPOS[g-NC].cs.length} filiais</span>`;

  // ---------- Dias úteis e ritmo ----------
  const [ano, mes] = C.mesRef.split("-").map(Number);
  const fer = new Set(C.feriados||[]);
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const corte = C.dataCorte ? new Date(C.dataCorte+"T12:00:00") : null;
  let uteisMes=0, uteisPassados=0;
  for(let d=new Date(ano,mes-1,1,12); d.getMonth()===mes-1; d.setDate(d.getDate()+1)){
    if(d.getDay()!==0 && d.getDay()!==6 && !fer.has(iso(d))){ uteisMes++; if(corte && d<=corte) uteisPassados++; }
  }
  const uteisRestantes = uteisMes - uteisPassados;
  const ritmo = corte ? uteisPassados/uteisMes : null;
  const status = p => !ok(p)||!ok(ritmo) ? "none" : p>=ritmo ? "good" : p>=ritmo-0.10 ? "warn" : "bad";
  const statusTxt = {good:"No ritmo", warn:"Perto do ritmo", bad:"Abaixo do ritmo", none:"sem dado"};

  // ---------- Regras de cada meta (como o realizado é calculado) ----------
  const forn = (p,t) => P.produtos[p][1].toUpperCase().includes(t);
  const prod = (p,t) => P.produtos[p][0].toUpperCase().includes(t);
  const vendaMes = filtro => P.vendas.reduce((s,r)=> r[2]===cur && filtro(r[1]) ? s+r[3] : s, 0);
  const METAS_DEF = [
    {g:"Faturamento", ic:"cifrao", k:"total",     rot:"Faturamento total", calc:()=>vendaMes(()=>true)},
    {g:"Fornecedores",ic:"box", k:"msd",       rot:"MSD Pet",           calc:()=>vendaMes(p=>forn(p,"MSD"))},
    {g:"Fornecedores",ic:"frasco", k:"idexx",     rot:"IDEXX",             calc:()=>vendaMes(p=>forn(p,"IDEXX"))},
    {g:"Fornecedores",ic:"box", k:"vallee",    rot:"Vallée",            calc:()=>vendaMes(p=>forn(p,"VALL"))},
    {g:"Fornecedores",ic:"box", k:"absort",    rot:"Absortec",          calc:()=>vendaMes(p=>forn(p,"ABSORTEC"))},
    {g:"Fornecedores",ic:"box", k:"primore",   rot:"Primore",           calc:()=>vendaMes(p=>forn(p,"PRIMORE"))},
    {g:"Fornecedores",ic:"gota", k:"totalquim", rot:"Total Química",     calc:()=>vendaMes(p=>forn(p,"TOTAL QUIMICA"))},
    {g:"Linhas MSD",  ic:"seringa", k:"nobiv",     rot:"Nobivac",           calc:()=>vendaMes(p=>prod(p,"NOBIVAC"))},
    {g:"Linhas MSD",  ic:"pata", k:"campanha",  rot:"Campanha antiparasitária (Bravecto, Defenza e Bravecto 365)", calc:()=>vendaMes(p=>prod(p,"BRAVECTO")||prod(p,"DEFENZA "))},
    {g:"Linhas MSD",  ic:"escudo", k:"scalib",    rot:"Scalibor",          calc:()=>vendaMes(p=>prod(p,"SCALIBOR"))},
    {g:"Linhas MSD",  ic:"pilula", k:"farma",     rot:"Farma",             calc:()=>vendaMes(p=>P.produtos[p][2]===1)},
    {g:"Atividade",   ic:"pessoas", k:"pos",       rot:"Positivação (clientes CNPJ)", un:true, calc:()=>positivados().length},
    {g:"Atividade",   ic:"mais", k:"itens",     rot:"Introdução de itens", un:true, calc:()=>introItens()},
    {g:"Atividade",   ic:"estrela", k:"cluster_ouro", rot:"Cluster Ouro (média)", soMeta:true}
  ];
  function positivados(){ const r=[]; for(let c=0;c<NC;c++) if(isJ(c)&&temLinha[c][cur]) r.push(c); return r; }
  // Introdução: conta 1 por cliente CNPJ que faturou no mês pelo menos 1 item que não comprou nos 12 meses anteriores (regra do Lucas, 16/10/2026)
  function introItens(){
    let n=0;
    for(let c=0;c<NC;c++){
      if(!isJ(c)) continue;   // só CNPJ
      const agora=new Set(), antes=new Set();
      // mês atual: só venda faturada (r[5] > 0); 12 meses anteriores: qualquer linha
      linhasCli[c].forEach(r=>{ if(r[2]===cur){ if(r[5]>0) agora.add(r[1]); } else if(r[2]>=cur-12 && r[2]<cur) antes.add(r[1]); });
      for(const p of agora){ if(!antes.has(p)){ n++; break; } }   // 1 por cliente com pelo menos 1 item novo
    }
    return n;
  }
  const metas = METAS_DEF.map(d=>{
    const meta = C.metas[d.k], real = d.soMeta ? null : d.calc();
    const p = ok(meta)&&meta>0&&ok(real) ? real/meta : null;
    return {...d, meta, real, p, st: d.soMeta||!(meta>0) ? "none" : status(p)};
  });
  const mt = k => metas.find(x=>x.k===k);

  // ---------- Listas das seções ----------
  const w12a = cur-12, w12b = cur-1;
  const tot12 = Array.from({length:NC}, (_,c)=>soma(c,w12a,w12b));
  const totalCarteira12 = tot12.reduce((a,b)=>a+b,0);
  const top20 = [...Array(NC).keys()].filter(c=>tot12[c]>0).sort((a,b)=>tot12[b]-tot12[a]).slice(0,20);

  // Sem compra no mês, por tempo sem comprar (contado pelo mês da última compra, contando o mês atual):
  //   todos = comprou nos últimos 12 meses e ainda não comprou no mês
  //   3     = última compra há 3 a 5 meses (ex.: em setembro, última compra entre abr e jun)
  //   6     = última compra há 6 a 12 meses
  // compra = mês com valor vendido acima de zero (linha só de devolução não conta), igual à coluna "Última compra"
  const mesesSem = c => { for(let m=cur; m>=Math.max(cur-12,0); m--) if(porCliMes[c][m]>0) return cur-m; return null; };
  const FAIXAS_SEM = { todos:[1,12], "3":[3,5], "6":[6,12] };
  const semLista = f => { const [a,b] = FAIXAS_SEM[f]; return [...Array(NC).keys()].filter(c=>{ const n=mesesSem(c); return n!==null && n>=a && n<=b; })
    .sort((x,y)=>soma(y,cur-12,cur-1)-soma(x,cur-12,cur-1)); };
  const JANELA_SEM = 6;
  const semCompra = [...Array(NC).keys()].filter(c=>!temLinha[c][cur] && soma(c,cur-JANELA_SEM,cur-1)>0)
    .sort((a,b)=>soma(b,cur-JANELA_SEM,cur-1)-soma(a,cur-JANELA_SEM,cur-1));

  function topProdutos(c, n){
    const t = new Map();
    linhasCli[c].forEach(r=>{ if(r[2]>=w12a && r[2]<=w12b) t.set(r[1],(t.get(r[1])||0)+r[3]); });
    return [...t.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(([p])=>P.produtos[p][0]);
  }

  // ========== CONQUISTAS (gamificação, tudo em %) ==========
  // Números calculados pelo gamificacao.py. Aqui só entram os do próprio RCA e a posição dele.
  const GM = C.gamificacao || null;
  const NIVEL = ["Sem nível","Bronze","Prata","Ouro"];
  // Mix (itens ÷ catálogo, fica entre 2% e 4%) e Foco MSD mostram 1 casa decimal
  const fmtG = (k,v,d) => !ok(v) ? "sem dado" : (k==="evolucao"?(v>=0?"+":"−"):"")+(Math.abs(v)*100).toLocaleString("pt-BR",(()=>{ const c = d!==undefined?d:(k==="mix"||k==="msd"?1:0); return {minimumFractionDigits:k==="mix"?c:0, maximumFractionDigits:c}; })())+"%";
  const lvBadge = n => `<span class="lv n${n}">${n?ICON.medalha:""}${NIVEL[n]}</span>`;
  const novoRec = e => ok(e.atual) && ok(e.recorde) && e.atual > e.recorde;
  const novosRec = GM ? GM.medidas.filter(m=>novoRec(GM.eu[m.k])).length : 0;
  // Quanto falta para chegar num % : em clientes quando a medida é contada em clientes, senão em pontos
  function falta(k, alvo, atual){
    if(!ok(alvo)||!ok(atual)||atual>=alvo) return "";
    const c = GM.contas[k];
    if(c){ const [f,t] = c; let n;
      if(k==="introducao"){ if(alvo>=1) return ""; n = Math.ceil((alvo*t-f)/(1-alvo)); }
      else n = Math.ceil(alvo*t-f);
      n = Math.max(n,1);
      const o = {base:"cliente|clientes comprando", recuperacao:"parado voltando|parados voltando", introducao:"cliente|clientes com item novo"}[k].split("|");
      return `${k==="introducao"?"cerca de ":""}${n} ${n===1?o[0]:o[1]}`;
    }
    if(k==="mix" && GM.catalogo){ const it = Math.max((alvo-atual)*GM.catalogo, 0.1);
      return `${it.toLocaleString("pt-BR",{maximumFractionDigits:1})} ${it>1?"itens":"item"} a mais por cliente, em média`; }
    const d = Math.max((alvo-atual)*100, 0.1);
    return `${d.toLocaleString("pt-BR",{maximumFractionDigits:1})} ponto${d<=1?"":"s"}`;
  }
  function regua(k, e){
    const r = GM.reguas[k]; if(!r) return "";
    const vals = [e.atual, e.recorde].filter(ok), span = (r[2]-r[0]) || 0.05;
    let lo = Math.min(r[0]-span*1.2, ...vals), hi = Math.max(r[2]+span*0.6, ...vals);
    const pad = (hi-lo)*0.04; lo -= pad; hi += pad;
    const x = v => ((v-lo)/(hi-lo)*100).toFixed(1)+"%";
    // rótulos muito próximos: o do meio desce uma linha para não encavalar
    const px = r.map(v=>(v-lo)/(hi-lo)*100), baixo = px.map((p,i)=>i>0 && p-px[i-1]<9 && !(i>1 && px[i-1]-px[i-2]<9));
    return `<div class="lad${baixo.some(Boolean)?" dup":""}" role="img" aria-label="Régua: Bronze ${fmtG(k,r[0])}, Prata ${fmtG(k,r[1])}, Ouro ${fmtG(k,r[2])}">
      <div class="tr">${ok(e.atual)?`<i style="width:${x(e.atual)}"></i>`:""}</div>
      ${r.map((v,i)=>`<span class="tk n${i+1}" style="left:${x(v)}"></span><span class="tl${baixo[i]?" b2":""}" style="left:${x(v)}">${fmtG(k,v)}</span>`).join("")}
      ${ok(e.recorde)&&k!=="ritmo"?`<span class="rc" style="left:${x(e.recorde)}" title="Seu recorde">▼</span>`:""}</div>`;
  }
  function histG(vals, recIdx){
    const vs = vals.filter(ok); if(vs.length<2) return "";
    const W=260, H=40, n=vals.length, bw=W/n, mx=Math.max(0,...vs), mn=Math.min(0,...vs), sc=(H-4)/((mx-mn)||1), y0=2+mx*sc;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${vals.map((v,i)=>{ if(!ok(v)) return "";
      const h=Math.max(1.5,Math.abs(v)*sc), y=v>=0?y0-h:y0, cor = i===n-1?"var(--accent)":i===recIdx?"#F5CF5A":"var(--faint)";
      return `<rect x="${(i*bw+2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${cor}" opacity="${i===n-1||i===recIdx?1:.5}"/>`; }).join("")}</svg>`;
  }
  function drawConquistas(){
    if(!GM){ section(`<div class="head"><div><h1>Conquistas</h1></div></div><div class="panel empty">sem dado: rode o gerar_dash_rca.py de novo para calcular a gamificação</div>`); return; }
    const E = GM.eu, R = GM.reguas, MS = GM.medidas, nome = k => MS.find(m=>m.k===k).nome;
    const niveis = [0,0,0,0]; MS.forEach(m=>niveis[E[m.k].nivel]++);
    const novos = MS.filter(m=>novoRec(E[m.k]));
    // medida mais perto de virar recorde (em % do recorde)
    const perto = MS.filter(m=>m.k!=="ritmo" && !novoRec(E[m.k]) && ok(E[m.k].atual) && ok(E[m.k].recorde) && E[m.k].recorde>0)
      .map(m=>({m, gap:(E[m.k].recorde-E[m.k].atual)/Math.abs(E[m.k].recorde)})).sort((a,b)=>a.gap-b.gap)[0];
    const conqAno = MS.reduce((s,m)=>s+E[m.k].conquistas.length,0);
    const juntaE = arr => arr.length<2 ? arr.join("") : arr.slice(0,-1).join(", ")+" e "+arr[arr.length-1];
    const heroTxt = novos.length
      ? `Em ${MES_NOME[mes-1]} você já passou o seu próprio recorde em ${juntaE(novos.map(m=>`<b>${m.nome}</b>`))}. Essa é a sua melhor versão até agora.`
      : perto ? `Você está a <b>${falta(perto.m.k, E[perto.m.k].recorde+1e-6, E[perto.m.k].atual)}</b> de bater o seu recorde em <b>${perto.m.nome}</b> (${fmtG(perto.m.k,E[perto.m.k].recorde)} em ${mesCurto(E[perto.m.k].recordeMes)}).`
      : `Continue: cada mês é uma chance de superar a sua melhor marca.`;
    const D = GM.desafio;

    const cards = MS.map(m=>{ const k=m.k, e=E[k], nr=novoRec(e), r=R[k];
      const prox = e.nivel<3 && r ? `Próximo: <b>${NIVEL[e.nivel+1]}</b> em ${fmtG(k,r[e.nivel])}${falta(k,r[e.nivel],e.atual)?` · faltam ${falta(k,r[e.nivel],e.atual)}`:""}` : `<b>Ouro</b>: nível máximo. Agora é bater o seu recorde.`;
      const rec = k==="ritmo" ? `Sem recorde: só existe a meta deste mês`
        : !ok(e.recorde) ? `Recorde: sem dado`
        : nr ? `Recorde anterior: ${fmtG(k,e.recorde)} em ${mesCurto(e.recordeMes)}. <b>Você já passou.</b>`
        : `Seu recorde: <b>${fmtG(k,e.recorde)}</b> em ${mesCurto(e.recordeMes)}${falta(k,e.recorde+1e-6,e.atual)?` · faltam ${falta(k,e.recorde+1e-6,e.atual)}`:""}`;
      const seq = e.seq>0 ? `<li><b>${e.seq} ${e.seq===1?"mês":"meses"} seguido${e.seq===1?"":"s"}</b> em Prata ou mais</li>` : "";
      return `<div class="gc${nr?" novo":""}">
        <div class="t"><b>${m.nome}</b>${lvBadge(e.nivel)}</div>
        <div class="v">${fmtG(k,e.atual)}${nr?`<span class="rec">${ICON.estrela} Novo recorde</span>`:""}</div>
        <div class="d">${k==="mix"&&ok(e.atual)&&GM.catalogo?`cada cliente leva, em média, <b style="color:var(--ink)">${(e.atual*GM.catalogo).toLocaleString("pt-BR",{maximumFractionDigits:1})} itens diferentes</b> dos ${GM.catalogo} já vendidos pela equipe`:esc(m.desc)}</div>
        ${regua(k,e)}
        <ul><li>${prox}</li><li>${rec}</li>${seq}</ul>
        ${k!=="ritmo"?`<div class="hist">${histG(e.serie, GM.meses.indexOf(e.recordeMes))}</div>`:""}
      </div>`; }).join("");

    const linhas = [];
    MS.forEach(m=>{ E[m.k].conquistas.forEach(([mk,v,antes])=>linhas.push({mk, m, v, antes, agora:false}));
      if(novoRec(E[m.k])) linhas.push({mk:C.mesRef, m, v:E[m.k].atual, antes:E[m.k].recorde, agora:true}); });
    linhas.sort((a,b)=>b.mk.localeCompare(a.mk));
    const tl = linhas.length ? linhas.map(l=>`<div class="tl-it"><span class="m">${mesCurto(l.mk)}${l.agora?" · até agora":""}</span><span class="ic2">${ICON.trofeu}</span>
        <span>Recorde de <b>${l.m.nome}</b></span><span class="x">${fmtG(l.m.k,l.antes)===fmtG(l.m.k,l.v)?`${fmtG(l.m.k,l.antes,1)} → ${fmtG(l.m.k,l.v,1)}`:`${fmtG(l.m.k,l.antes)} → ${fmtG(l.m.k,l.v)}`}</span></div>`).join("")
      : `<div class="empty">Nenhum recorde batido ainda. O primeiro é o mais gostoso.</div>`;

    const destq = GM.destaques.map(k=>{ const e=E[k], p=GM.posicoes[k];
      return `<div class="it"><b>${nome(k)}</b>${lvBadge(e.nivel)}
        <span class="mini">Você: <b style="color:var(--ink)">${fmtG(k,e.atual)}</b>${ok(p)&&p<=3?` · <span class="rk r${p}">${ICON.medalha}${p}º</span> na equipe`:""}</span></div>`; }).join("");

    section(`
      <div class="head hpop"><div><div class="hello">Tudo em %: você contra a sua melhor marca</div><h1>Conquistas</h1><div class="sub">${mesLongo(C.mesRef)}${corte?`, dados até ${corte.toLocaleDateString("pt-BR").slice(0,5)}`:""} · recordes contam desde ${mesCurto(GM.meses[0])}</div></div>
        <div class="hbtns"><button class="btn sm" data-pop="poprec" aria-expanded="false">${ICON.trofeu} Seus recordes (${linhas.length})</button><button class="btn sm" data-pop="popinfo" aria-expanded="false"><span class="ii">i</span> Como funciona</button></div>
        <div class="pop panel" id="poprec" hidden><div class="ph"><h2>Linha do tempo dos seus recordes</h2><button class="fechar" data-fecha aria-label="Fechar">×</button></div><div class="tl-list">${tl}</div></div>
        <div class="pop panel" id="popinfo" hidden><div class="ph"><h2>Como funciona</h2><button class="fechar" data-fecha aria-label="Fechar">×</button></div>
          <ul class="regras" style="grid-template-columns:1fr">
            <li><b>Bronze, Prata e Ouro</b> são réguas fixas, iguais para todos. Se todo mundo chegar no Ouro, todo mundo ganha.</li>
            <li>As réguas são definidas pelo supervisor e valem igual para todos.${R.evolucao?` Em Evolução, a régua é a cobrança da indústria: Bronze = crescer a partir de 1%, Prata = 10%, Ouro = 20%.`:""}</li>
            <li><b>Recorde</b> = seu melhor mês fechado desde ${mesCurto(GM.meses[0])}. O mês atual ainda está em andamento.</li>
            <li><b>Sequência</b> = meses fechados seguidos em Prata ou mais.</li>
            <li>Os números dos colegas não aparecem aqui.</li>
          </ul></div>
      </div>
      <div class="panel hero">
        <div><div class="k">${ICON.estrela} Sua melhor versão</div><h2>${novos.length?`${novos.length} recorde${novos.length===1?"":"s"} pessoal${novos.length===1?"":"is"} neste mês`:"Seu próximo recorde está perto"}</h2><p>${heroTxt}</p></div>
        <div class="cont">
          <div class="c3"><b>${niveis[3]}</b><span>Ouro</span></div>
          <div class="c2"><b>${niveis[2]}</b><span>Prata</span></div>
          <div class="c1"><b>${niveis[1]}</b><span>Bronze</span></div>
          <div class="cr"><b>${conqAno+novos.length}</b><span>recordes em ${ano}</span></div>
        </div>
      </div>
      <div class="duo">
        <div class="panel"><div class="ph"><h2>Desafio da equipe</h2><span class="tag">todos juntos</span></div>
          <p class="lead">Bater o melhor mês da equipe em <b>aproveitamento da base</b>: <b>${pct(D.alvo,1)}</b> em ${mesCurto(D.alvoMes)}.</p>
          <div class="gbar" role="img" aria-label="Equipe em ${pct(D.atual,1)} de ${pct(D.alvo,1)}"><div class="fill" style="width:${Math.min(D.atual/D.alvo,1)*100}%"></div></div>
          <div class="mini">Equipe hoje: <b style="color:var(--ink)">${pct(D.atual,1)}</b>${D.faltam>0?` · faltam <b style="color:var(--ink)">${D.faltam}</b> clientes comprando, somando todo mundo`:` · <span class="up">recorde da equipe batido!</span>`}. Cada cliente que você positiva conta para o time.</div>
        </div>
        <div class="panel"><div class="ph"><h2>Destaques de ${MES_NOME[mes-1]}</h2><span class="tag">mudam todo mês</span></div>
          <div class="dest">${destq}</div>
          ${GM.proxDestaques?`<div class="mini" style="margin-top:10px">Em ${MES_NOME[mes%12]}: ${GM.proxDestaques.map(nome).join(" e ")}.</div>`:""}
        </div>
      </div>
      <div class="ph" style="margin:4px 0 -4px"><h2>Suas ${MS.length} medidas</h2><span class="tag" style="white-space:normal">▼ = seu recorde · barra dourada = mês do recorde</span></div>
      <div class="gcards">${cards}</div>
`);
  }

  // Quadros que abrem pelos botões do topo (Seus recordes / Como funciona): fecham no ×, clicando fora ou rolando a página
  const fechaPops = () => document.querySelectorAll(".pop").forEach(p=>{ p.hidden=true; const b=document.querySelector(`[data-pop="${p.id}"]`); if(b) b.setAttribute("aria-expanded","false"); });
  document.addEventListener("click", e=>{
    const b = e.target.closest("[data-pop]");
    if(b){ const p = el(b.dataset.pop), abrir = p.hidden; fechaPops(); if(abrir){ p.hidden=false; b.setAttribute("aria-expanded","true"); } return; }
    if(e.target.closest("[data-fecha]") || !e.target.closest(".pop")) fechaPops();
  });
  window.addEventListener("scroll", fechaPops, {passive:true});
  // gesto de rolar fora do quadro também fecha (mesmo quando a página cabe inteira na tela)
  ["wheel","touchmove"].forEach(ev=>window.addEventListener(ev, e=>{ if(!e.target.closest(".pop")) fechaPops(); }, {passive:true}));

  // ---------- Navegação (sidebar) ----------
  // Para criar uma seção nova: acrescente um item aqui com id, rótulo e a função que desenha.
  const SECOES = [
    {id:"mes",       ic:"home",     rot:"Meu mês",               draw:drawMes},
    ...(C.beta ? [{id:"plano", ic:"calendario", rot:"Plano do mês", draw:drawPlano}] : []),
    {id:"oport",     ic:"alvo",     rot:"Oportunidades",         draw:drawOport},
    {id:"clientes",  ic:"pessoas",  rot:"Clientes",              draw:drawClientes, cnt:()=>NC},
    {id:"produtos",  ic:"box",      rot:"Produtos",              draw:drawProdutos},
    {id:"semcompra", ic:"local",    rot:"Sem compra no mês",     draw:drawSem, cnt:()=>semLista("todos").filter(isJ).length},
    {id:"analitico", ic:"tabela",   rot:"Analítico",             draw:drawAnalitico},
    {id:"conquistas",ic:"trofeu",   rot:"Conquistas",            draw:drawConquistas, cnt: novosRec>0 ? ()=>"★ "+novosRec : null},
  ];
  let atual = null, clienteSel = null, prodFiltro = "";
  function ir(id, opts){
    atual = SECOES.find(s=>s.id===id) || SECOES[0];
    el("nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.id===atual.id));
    el("main").innerHTML = "";
    atual.draw(opts||{});
    try{ history.replaceState(null,"","#"+atual.id); }catch(e){}
    window.scrollTo(0,0);
  }
  el("nav").innerHTML = SECOES.map(s=>`<button data-id="${s.id}"${s.sub?' class="sub"':""}>${ICON[s.ic]||""}<span>${s.rot}</span>${s.cnt?`<span class="cnt">${s.cnt()}</span>`:""}</button>`).join("");
  el("logo").innerHTML = ICON.cruz; el("sbic").innerHTML = ICON.busca;
  el("sbusca").addEventListener("input", e=>{ const q=e.target.value;
    if(atual && atual.id==="clientes" && el("busca")){ el("busca").value=q; el("busca").dispatchEvent(new Event("input")); } else ir("clientes",{q}); e.target.focus(); });
  el("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) ir(b.dataset.id); });
  el("main").addEventListener("click", e=>{
    const fb = e.target.closest("[data-fil]");
